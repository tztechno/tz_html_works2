const videoListEl = document.getElementById('videoList');
const resultCountEl = document.getElementById('resultCount');
const emptyStateEl = document.getElementById('emptyState');
const totalCountEl = document.getElementById('totalCount');
const searchInput = document.getElementById('searchInput');
const sortSelect = document.getElementById('sortSelect');
const clearBtn = document.getElementById('clearBtn');

totalCountEl.textContent = VIDEOS.length;

function escapeRegExp(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlight(title, query){
  if(!query) return document.createTextNode(title);
  const frag = document.createDocumentFragment();
  const re = new RegExp('(' + escapeRegExp(query) + ')', 'ig');
  const parts = title.split(re);
  parts.forEach(part => {
    if(part.toLowerCase() === query.toLowerCase()){
      const mark = document.createElement('mark');
      mark.textContent = part;
      frag.appendChild(mark);
    } else if(part.length){
      frag.appendChild(document.createTextNode(part));
    }
  });
  return frag;
}

function buildCard(v, query){
  const card = document.createElement('div');
  card.className = 'video-card';

  const link = document.createElement('a');
  link.className = 'video-title';
  link.href = v.url;
  link.target = '_blank';
  link.rel = 'noopener';
  link.appendChild(highlight(v.title, query));
  card.appendChild(link);

  const meta = document.createElement('div');
  meta.className = 'video-meta';

  if(v.duration){
    const d = document.createElement('span');
    d.className = 'badge';
    d.textContent = v.duration;
    meta.appendChild(d);
  }

  if(v.upcoming){
    const b = document.createElement('span');
    b.className = 'badge upcoming';
    b.textContent = 'プレミア公開予定';
    meta.appendChild(b);
  } else if(v.member_only){
    const b = document.createElement('span');
    b.className = 'badge member';
    b.textContent = 'メンバー限定';
    meta.appendChild(b);
  } else if(v.views_text){
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = v.views_text;
    meta.appendChild(b);
  }

  if(v.date_text){
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.textContent = '・';
    meta.appendChild(dot);
    const dt = document.createElement('span');
    dt.textContent = v.date_text;
    meta.appendChild(dt);
  }

  card.appendChild(meta);
  return card;
}

function getSorted(list, mode){
  const arr = list.slice();
  if(mode === 'new'){
    arr.sort((a,b) => a.rank - b.rank);
  } else if(mode === 'old'){
    arr.sort((a,b) => b.rank - a.rank);
  } else if(mode === 'views_desc'){
    arr.sort((a,b) => (b.views ?? -1) - (a.views ?? -1));
  } else if(mode === 'views_asc'){
    arr.sort((a,b) => (a.views ?? Infinity) - (b.views ?? Infinity));
  }
  return arr;
}

let renderToken = 0;

function render(){
  const query = searchInput.value.trim();
  const mode = sortSelect.value;

  let filtered = VIDEOS;
  if(query){
    const q = query.toLowerCase();
    filtered = VIDEOS.filter(v => v.title.toLowerCase().includes(q));
  }
  const sorted = getSorted(filtered, mode);

  resultCountEl.innerHTML = query
    ? `「${query.replace(/</g,'&lt;')}」の検索結果: <b>${sorted.length}</b> 件`
    : `全 <b>${sorted.length}</b> 件`;

  videoListEl.innerHTML = '';
  emptyStateEl.style.display = sorted.length ? 'none' : 'block';

  const token = ++renderToken;
  const CHUNK = 120;
  let i = 0;
  function renderChunk(){
    if(token !== renderToken) return;
    const frag = document.createDocumentFragment();
    const end = Math.min(i + CHUNK, sorted.length);
    for(; i < end; i++){
      frag.appendChild(buildCard(sorted[i], query));
    }
    videoListEl.appendChild(frag);
    if(i < sorted.length){
      requestAnimationFrame(renderChunk);
    }
  }
  renderChunk();
}

let debounceTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(render, 120);
});
sortSelect.addEventListener('change', render);
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  sortSelect.value = 'new';
  render();
});

render();
</script>
