<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文Q&amp;Aアシスタント</title>
<style>
  :root{
    --bg:#f7f7f5;
    --panel:#ffffff;
    --accent:#c96442;
    --accent-dark:#a84f34;
    --text:#2b2620;
    --muted:#8a8378;
    --border:#e4e0d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:16px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  header h1{
    font-size:18px;
    margin:0;
  }
  header .sub{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
  }
  .container{
    max-width:780px;
    margin:0 auto;
    padding:16px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    margin-bottom:16px;
  }
  .panel h2{
    font-size:15px;
    margin:0 0 12px 0;
    color:var(--accent-dark);
  }
  /* Model load status */
  .status-bar{
    font-size:13px;
    color:var(--muted);
  }
  .status-bar .status-title{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .status-bar .status-title span:first-child{color:var(--accent-dark); font-weight:600;}
  .bar-track{
    height:6px;
    background:#efece5;
    border-radius:4px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width 0.3s ease;
  }
  textarea{
    width:100%;
    min-height:180px;
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    resize:vertical;
    line-height:1.6;
  }
  input[type="text"]{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
  }
  select{
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:13px;
    font-family:inherit;
  }
  button{
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:9px 18px;
    font-size:14px;
    font-weight:600;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--accent-dark);}
  .btn-primary:disabled{opacity:0.45; cursor:not-allowed;}
  .action-row{
    display:flex;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .action-row label{
    font-size:13px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .limit-note{
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
  }
  #qaPanel{display:none;}
  .qa-item{
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:12px;
    background:#faf9f6;
  }
  .qa-item .q{
    font-size:14px;
    font-weight:600;
    color:var(--accent-dark);
    margin-bottom:8px;
  }
  .qa-item .a{
    font-size:15px;
    line-height:1.8;
    white-space:pre-wrap;
  }
  .cursor-blink::after{
    content:'▍';
    animation:blink 1s step-start infinite;
    color:var(--accent);
  }
  @keyframes blink{50%{opacity:0;}}
  footer{
    text-align:center;
    margin-top:24px;
    font-size:11px;
    color:var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>英文Q&amp;Aアシスタント</h1>
  <div class="sub">英文を貼り付けて質問すると、その内容に基づいて答えます。すべてブラウザ内のローカル推論で完結し、外部には送信されません。</div>
</header>

<div class="container">

  <!-- Model load status -->
  <div class="panel">
    <div class="status-bar" id="statusBar">
      <div class="status-title">
        <span id="statusLabel">モデルを準備中…</span>
        <span id="statusPercent">0%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    </div>
  </div>

  <!-- Source text input -->
  <div class="panel">
    <h2>① 英文を入力</h2>
    <textarea id="sourceText" placeholder="ニュース記事などの英文をここに貼り付けてください（複数行OK）"></textarea>
    <div class="limit-note">非常に長い文章の場合、モデルが全体を読み切れずに一部しか参照できないことがあります。</div>
  </div>

  <!-- Question input -->
  <div class="panel">
    <h2>② 質問する</h2>
    <input type="text" id="questionInput" placeholder="例：この記事の主な主張は何ですか？ / What is the main claim of this article?">
    <div class="action-row">
      <button class="btn-primary" id="askBtn" disabled>質問する</button>
      <label>
        回答言語:
        <select id="answerLang">
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
  </div>

  <!-- Q&A history -->
  <div class="panel" id="qaPanel">
    <h2>③ 質問と回答</h2>
    <div id="qaList"></div>
  </div>

  <footer>すべてローカル推論 · wllama + Qwen2.5-1.5B-Instruct-GGUF</footer>
</div>

<script type="module">
import { Wllama } from 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2/esm/index.js';

// Paths to wllama's WASM runtime, loaded from CDN so this stays a single HTML file.
// Using v2 (CPU/WASM only, no WebGPU offload) rather than v3, matching the combination
// already confirmed working in a previous local-inference app (v3 had a version-skew
// bug where completion requests failed with "key 'prompt' not found" on the worker side).
const CONFIG_PATHS = {
  'single-thread/wllama.wasm': 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2/esm/single-thread/wllama.wasm',
  'multi-thread/wllama.wasm': 'https://cdn.jsdelivr.net/npm/@wllama/wllama@2/esm/multi-thread/wllama.wasm',
};

// GGUF model hosted on Hugging Face Hub. bartowski's Qwen2.5-1.5B-Instruct (~1GB) has
// downloaded reliably in-browser in prior testing, unlike some larger Xet-backed files.
const MODEL_URL = 'https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf';

const wllama = new Wllama(CONFIG_PATHS);

const statusLabel = document.getElementById('statusLabel');
const statusPercent = document.getElementById('statusPercent');
const barFill = document.getElementById('barFill');
const askBtn = document.getElementById('askBtn');
const sourceText = document.getElementById('sourceText');
const questionInput = document.getElementById('questionInput');
const answerLang = document.getElementById('answerLang');
const qaPanel = document.getElementById('qaPanel');
const qaList = document.getElementById('qaList');

// ------------------------------------------------------------------
// Load the model on page open and report progress in the status bar.
// Uses the model's default context window (no n_ctx override), matching
// the exact call signature already confirmed working in the tarot app -
// a very long passage may exceed this and only be partially considered.
// ------------------------------------------------------------------
async function initModel() {
  try {
    await wllama.loadModelFromUrl(MODEL_URL, {
      useCache: false, // avoid reusing a possibly-corrupted cache from earlier failed load attempts
      progressCallback: ({ loaded, total }) => {
        const pct = total ? Math.round((loaded / total) * 100) : 0;
        statusPercent.textContent = pct + '%';
        barFill.style.width = pct + '%';
      },
    });
    statusLabel.textContent = 'モデルの準備が整いました';
    statusPercent.textContent = '';
    barFill.style.width = '100%';
    askBtn.disabled = false;
  } catch (err) {
    // Show the raw error message inline so the failure reason is visible without opening DevTools
    statusLabel.textContent = '読み込み失敗: ' + (err && err.message ? err.message : String(err));
    console.error(err);
  }
}

// ------------------------------------------------------------------
// Build a ChatML prompt (Qwen's format) grounding the model in the
// user-supplied passage, and stream the answer into a new Q&A entry.
// ------------------------------------------------------------------
async function askQuestion(passage, question, lang) {
  const systemPrompt = lang === 'en'
    ? 'You are a careful reading comprehension assistant. Answer the question in English, using only the information in the passage the user provides. If the passage does not contain the answer, say so honestly instead of guessing.'
    : 'あなたは読解アシスタントです。ユーザーが提示した英文の内容にのみ基づいて、質問に日本語で簡潔かつ正確に答えてください。英文に書かれていないことは推測せず、本文に記載がない場合は正直にそう伝えてください。';

  const userPrompt = (lang === 'en' ? 'Passage:\n' : '英文:\n') + passage +
    '\n\n' + (lang === 'en' ? 'Question: ' : '質問: ') + question;

  const prompt =
    '<|im_start|>system\n' + systemPrompt + '\n<|im_end|>\n' +
    '<|im_start|>user\n' + userPrompt + '\n<|im_end|>\n' +
    '<|im_start|>assistant\n';

  // Create the Q&A entry up front so the answer can stream into it
  const item = document.createElement('div');
  item.className = 'qa-item';
  const qEl = document.createElement('div');
  qEl.className = 'q';
  qEl.textContent = 'Q. ' + question;
  const aEl = document.createElement('div');
  aEl.className = 'a cursor-blink';
  item.appendChild(qEl);
  item.appendChild(aEl);
  qaList.insertBefore(item, qaList.firstChild);
  qaPanel.style.display = 'block';

  await wllama.createCompletion(prompt, {
    nPredict: 400,
    sampling: { temp: 0.4, top_k: 40, top_p: 0.9 },
    onNewToken: (token, piece, currentText) => {
      aEl.textContent = currentText;
    },
  });
  aEl.classList.remove('cursor-blink');
}

askBtn.addEventListener('click', async () => {
  const passage = sourceText.value.trim();
  const question = questionInput.value.trim();
  if (!passage) {
    alert('英文を入力してください。');
    sourceText.focus();
    return;
  }
  if (!question) {
    alert('質問を入力してください。');
    questionInput.focus();
    return;
  }

  askBtn.disabled = true;
  askBtn.textContent = '考えています…';
  try {
    await askQuestion(passage, question, answerLang.value);
    questionInput.value = '';
  } catch (err) {
    alert('回答の生成に失敗しました: ' + (err && err.message ? err.message : String(err)));
    console.error(err);
  }
  askBtn.disabled = false;
  askBtn.textContent = '質問する';
  questionInput.focus();
});

questionInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !askBtn.disabled) askBtn.click();
});

initModel();
</script>

</body>
</html>
