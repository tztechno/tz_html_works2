<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上級英単語クイズ</title>
<style>
  :root{
    --bg:#f7f7f5;
    --panel:#ffffff;
    --accent:#c96442;
    --accent-dark:#a84f34;
    --text:#2b2620;
    --muted:#8a8378;
    --border:#e4e0d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:16px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  header h1{
    font-size:18px;
    margin:0;
  }
  .container{
    max-width:720px;
    margin:0 auto;
    padding:16px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    margin-bottom:16px;
  }
  .panel h2{
    font-size:15px;
    margin:0 0 12px 0;
    color:var(--accent-dark);
  }
  .checkbox-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  .checkbox-row label{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
  }
  button{
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:9px 18px;
    font-size:14px;
    font-weight:600;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-secondary{background:#efece5; color:var(--text);}
  .btn-secondary:disabled{opacity:0.5; cursor:not-allowed;}
  #quizPanel{display:none;}
  #resultPanel{display:none;}
  .progress{
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .jp-word{
    font-size:26px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:14px;
  }
  input[type="text"]{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:16px;
    font-family:inherit;
  }
  .action-row{
    display:flex;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .answer-box{
    margin-top:16px;
    padding:14px;
    background:#faf9f6;
    border:1px solid var(--border);
    border-radius:10px;
    display:none;
  }
  .answer-box .label{
    font-size:12px;
    color:var(--muted);
    margin-bottom:8px;
  }
  .answer-box ul{
    margin:0;
    padding-left:20px;
  }
  .answer-box li{
    font-size:18px;
    margin-bottom:6px;
  }
  .answer-note{
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
  }
</style>
</head>
<body>

<header>
  <h1>上級英単語クイズ</h1>
</header>

<div class="container">

  <!-- Settings panel -->
  <div class="panel" id="settingsPanel">
    <h2>出題設定（すべて上級レベルの単語です）</h2>
    <div class="checkbox-row" id="categoryChecks"></div>
    <button class="btn-primary" id="startBtn">クイズを始める</button>
  </div>

  <!-- Quiz panel -->
  <div class="panel" id="quizPanel">
    <div class="progress" id="progressLine"></div>
    <div class="jp-word" id="jpWord"></div>
    <input type="text" id="answerInput" placeholder="この意味に合う英単語を書いてみてください（送信はされません）">
    <div class="action-row">
      <button class="btn-primary" id="showBtn">解答例を見る</button>
      <button class="btn-secondary" id="nextBtn" disabled>次の問題へ</button>
    </div>

    <div class="answer-box" id="answerBox">
      <div class="label">解答例(参考)</div>
      <ul id="answerList"></ul>
      <div class="answer-note">正解は一通りではありません。同じ意味を表す別の単語でも問題ありません。</div>
    </div>
  </div>

  <!-- Result panel -->
  <div class="panel" id="resultPanel">
    <h2>お疲れさまでした</h2>
    <div id="finalDetail" style="color:var(--muted); font-size:14px;"></div>
    <button class="btn-primary" id="restartBtn" style="margin-top:14px;">もう一度挑戦する</button>
  </div>

</div>

// ------------------------------------------------------------------
// Utility: shuffle an array in place (Fisher-Yates)
// ------------------------------------------------------------------
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ------------------------------------------------------------------
// App state
// ------------------------------------------------------------------
let queue = [];
let currentIndex = 0;

const el = (id) => document.getElementById(id);

// ------------------------------------------------------------------
// Build category checkboxes from the question bank
// ------------------------------------------------------------------
const categories = [...new Set(QUESTIONS.map((q) => q.category))];
const categoryChecks = el("categoryChecks");
categories.forEach((cat) => {
  const label = document.createElement("label");
  const input = document.createElement("input");
  input.type = "checkbox";
  input.checked = true;
  input.dataset.category = cat;
  label.appendChild(input);
  label.appendChild(document.createTextNode(" " + cat));
  categoryChecks.appendChild(label);
});

// ------------------------------------------------------------------
// Start quiz: filter questions by selected categories, then shuffle
// ------------------------------------------------------------------
el("startBtn").addEventListener("click", () => {
  const selectedCategories = [...categoryChecks.querySelectorAll("input:checked")].map(
    (c) => c.dataset.category
  );

  queue = QUESTIONS.filter((q) => selectedCategories.includes(q.category));
  shuffle(queue);

  if (queue.length === 0) {
    alert("条件に合う問題がありません。カテゴリーを選び直してください。");
    return;
  }

  currentIndex = 0;
  el("settingsPanel").style.display = "none";
  el("resultPanel").style.display = "none";
  el("quizPanel").style.display = "block";
  showQuestion();
});

function showQuestion() {
  const q = queue[currentIndex];
  el("progressLine").textContent =
    "問題 " + (currentIndex + 1) + " / " + queue.length + "　[" + q.category + "]";
  el("jpWord").textContent = q.jp;
  el("answerInput").value = "";
  el("answerBox").style.display = "none";
  el("nextBtn").disabled = true;
  el("answerInput").focus();
}

// ------------------------------------------------------------------
// Reveal the example answers for the current question (no grading)
// ------------------------------------------------------------------
el("showBtn").addEventListener("click", () => {
  const q = queue[currentIndex];
  const list = el("answerList");
  list.innerHTML = "";
  q.answers.forEach((a) => {
    const li = document.createElement("li");
    li.textContent = a;
    list.appendChild(li);
  });
  el("answerBox").style.display = "block";
  el("nextBtn").disabled = false;
});

// ------------------------------------------------------------------
// Move to next question or finish
// ------------------------------------------------------------------
el("nextBtn").addEventListener("click", () => {
  currentIndex++;
  if (currentIndex >= queue.length) {
    showResults();
  } else {
    showQuestion();
  }
});

function showResults() {
  el("quizPanel").style.display = "none";
  el("resultPanel").style.display = "block";
  el("finalDetail").textContent = "全" + queue.length + "問終了しました。";
}

el("restartBtn").addEventListener("click", () => {
  el("resultPanel").style.display = "none";
  el("settingsPanel").style.display = "block";
});

// Allow pressing Enter in the answer field to reveal the example answers
el("answerInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") el("showBtn").click();
});
