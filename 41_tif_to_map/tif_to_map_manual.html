<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; background: #fff; font: 14px -apple-system, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

<title>地形図GeoTIFF位置確認 マニュアル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#f4efe0; --panel:#fffdf6; --panel-2:#faf5e7; --ink:#292416; --muted:#7d7458;
    --line:#e3d9bd; --accent:#4c7a4f; --accent-ink:#fbfaf3; --accent-soft:#e4ecdd;
    --contour:#a15a34; --danger:#a1473b; --shadow: 0 2px 14px rgba(60,50,20,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#14170f; --panel:#1b1f15; --panel-2:#1f2418; --ink:#eae4d0; --muted:#a39c85;
      --line:#333726; --accent:#8bb37c; --accent-ink:#0f1309; --accent-soft:#26301f;
      --contour:#d98a63; --danger:#e08a7d; --shadow: 0 2px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#14170f; --panel:#1b1f15; --panel-2:#1f2418; --ink:#eae4d0; --muted:#a39c85;
    --line:#333726; --accent:#8bb37c; --accent-ink:#0f1309; --accent-soft:#26301f;
    --contour:#d98a63; --danger:#e08a7d; --shadow: 0 2px 18px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    padding-inline: 20px; padding-block: 22px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace; font-variant-numeric: tabular-nums; }

  .page{ max-width: 760px; margin: 0 auto; }

  .topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom: 6px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:8px;
  }
  .eyebrow svg{ width:13px; height:13px; }
  h1{ font-size: 26px; margin:0 0 8px; font-weight:700; letter-spacing:-.01em; line-height:1.3; }
  .lede{ margin:0 0 4px; color:var(--muted); font-size:14.5px; max-width: 62ch; line-height:1.7; }

  .lang-switch{
    display:inline-flex; align-items:center; background:var(--panel); border:1px solid var(--line);
    border-radius:99px; padding:3px; gap:2px; flex-shrink:0; box-shadow:var(--shadow); margin-top:2px;
  }
  .lang-switch button{
    font:inherit; font-size:12px; font-weight:600; padding:5px 12px; border-radius:99px; border:none;
    background:transparent; color:var(--muted); cursor:pointer; transition:background .15s, color .15s;
  }
  .lang-switch button.active{ background:var(--accent); color:var(--accent-ink); }
  .lang-switch button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .open-tool{
    display:inline-flex; align-items:center; gap:7px; margin: 14px 0 30px; padding:11px 16px;
    background:var(--accent); color:var(--accent-ink); border-radius:10px; text-decoration:none;
    font-weight:600; font-size:14px; box-shadow:var(--shadow);
  }
  .open-tool:hover{ filter:brightness(1.05); }
  .open-tool svg{ width:15px; height:15px; }

  section{ margin: 34px 0; }
  section:first-of-type{ margin-top: 0; }
  h2{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--accent);
    margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px;
  }
  h2 .num{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); }
  h3{ font-size:15px; margin: 20px 0 8px; font-weight:600; }
  p{ line-height:1.75; font-size:14px; margin: 0 0 12px; }
  ol.steps{ margin:0; padding:0; list-style:none; counter-reset: step; }
  ol.steps > li{
    counter-increment: step; position:relative; padding-left:38px; margin-bottom:16px; line-height:1.7; font-size:14px;
  }
  ol.steps > li::before{
    content: counter(step); position:absolute; left:0; top:-1px; width:26px; height:26px; border-radius:50%;
    background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:12.5px;
    display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace;
  }
  ul.plain{ margin:0 0 12px; padding-left:20px; line-height:1.75; font-size:14px; }
  ul.plain li{ margin-bottom:6px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; margin: 4px 0 18px; }
  th, td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; }
  td.mono{ white-space:nowrap; }
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  .table-wrap table{ margin:0; }
  .table-wrap th, .table-wrap td{ border-bottom:1px solid var(--line); }
  .table-wrap tr:last-child td{ border-bottom:none; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); }
  .note{
    background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
    border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.65; margin: 10px 0 18px;
  }
  .note b{ color:var(--accent); }
  .warn{
    background:color-mix(in srgb, var(--danger) 10%, transparent); border:1px solid color-mix(in srgb, var(--danger) 30%, var(--line));
    border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.65; margin: 10px 0 18px;
  }
  .warn b{ color:var(--danger); }

  .faq dt{ font-weight:600; font-size:14px; margin-top:16px; }
  .faq dd{ margin:6px 0 0; font-size:13.5px; color:var(--muted); line-height:1.7; }

  footer{ margin-top:40px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }

  code{ font-family:"IBM Plex Mono",monospace; font-size:0.92em; background:var(--panel-2); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>




<div class="page">
  <div class="topbar">
    <div>
      <div class="eyebrow">

  </div>

  <a class="open-tool" id="openToolLink" href="https://claude.ai/artifact/Pftwwhk1ZKrcWRRrmfmwwC" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>

  <section>
    <h2><span class="num">01</span><span id="t-s1-title"></span></h2>
    <p id="t-s1-p1"></p>
    <p id="t-s1-p2"></p>
    <ul class="plain" id="t-s1-list"></ul>
  </section>

  <section>
    <h2><span class="num">02</span><span id="t-s2-title"></span></h2>
    <ol class="steps" id="t-s2-steps"></ol>
  </section>

  <section>
    <h2><span class="num">03</span><span id="t-s3-title"></span></h2>
    <p id="t-s3-p1"></p>
    <div class="table-wrap">
      <table>
        <thead><tr id="t-s3-thead"></tr></thead>
        <tbody id="t-s3-tbody"></tbody>
      </table>
    </div>
    <div class="note" id="t-s3-note"></div>
  </section>

  <section>
    <h2><span class="num">04</span><span id="t-s4-title"></span></h2>
    <div class="warn" id="t-s4-warn1"></div>
    <div class="warn" id="t-s4-warn2"></div>
    <p id="t-s4-p1"></p>
  </section>

  <section>
    <h2><span class="num">05</span><span id="t-s5-title"></span></h2>
    <p id="t-s5-p1"></p>
  </section>

  <section>
    <h2><span class="num">06</span><span id="t-s6-title"></span></h2>
    <dl class="faq" id="t-s6-faq"></dl>
  </section>

  <footer id="t-footer"></footer>
</div>

<script>
(() => {
  "use strict";

  const T = {

      lede: "GeoTIFF形式の地形図ファイルから四隅の緯度経度を読み取り、対応する範囲を地図上に表示するツールの解説です。処理はすべてブラウザ内で完結し、ファイルはどこにも送信されません。",
      openTool: "ツールを開く",
      s1Title: "概要",
      s1P1: "このツールは、GeoTIFF形式の地形図・空撮画像などを読み込み、画像に埋め込まれた地理参照情報（アフィン変換とEPSGコード）から四隅の緯度経度を自動計算します。計算結果は地理院地図またはOpenStreetMap上に、範囲を示す矩形・各隅のマーカー・画像そのもの（半透明オーバーレイ）として重ねて表示されます。",

      s2Steps: [

        { h: "GeoTIFFファイルを読み込む", p: "左側の「クリックしてファイルを選択」エリアをクリックするか、.tif / .tiff ファイルをドラッグ＆ドロップします。ファイルは外部サーバーに送信されず、すべてブラウザ内（JavaScript）で処理されます。" },

      s3TableRows: [

        ["UTM", "51N〜58N帯 (WGS84)", "南半球帯は32701〜32760で対応"],
        ["平面直角座標系", "第I系〜第XIX系 (JGD2000 / JGD2011 / 旧日本測地系)", "国土地理院の座標系原点定義に基づく"],
      ],
      s3Note: "<b>備考:</b> 上記以外のEPSGコード（マイナーな測地系など）は自動認識できません。その場合は手動選択欄で近い座標系を選ぶか、GeoTIFF側のGeoKeyDirectoryTagを確認してください。",

      s4Warn1: "<b>画像オーバーレイは近似表示です。</b>地図上に重ねる元画像は、四隅の外接矩形（最小・最大の緯度経度）を使って配置しています。GeoTIFFが回転・傾き（シアー）を持つ場合、実際の四隅と画像の表示位置に数メートル〜数十メートル程度のズレが生じることがあります。四隅の緯度経度の数値そのものは、この近似の影響を受けません。",
      s4Warn2: "<b>旧日本測地系（Tokyo Datum）は簡易変換です。</b>3パラメータ変換に近い簡易的な7パラメータ変換（dX=-146.414, dY=507.337, dZ=680.507）でWGS84に近似しています。数メートル程度の誤差が生じる場合があるため、高精度な測量用途には適しません。",

      s5Title: "プライバシーとデータの扱い",

        ["「座標系情報なし」と出ます", "GeoTIFF自体にアフィン変換情報（ModelPixelScale/ModelTiepointなど）が含まれていない可能性があります。この場合、四隅の座標そのものが計算できないため、手動選択でも復旧できません。元データを作成したソフトウェア側で地理参照情報を再設定してください。"],

      footer: "本ツールおよび本マニュアルは、地形図の位置確認を目的とした補助ツールです。測量法に基づく成果や公的な位置証明としての利用は想定していません。",

    en: {
      eyebrow: "User Manual",
      h1: "Topo GeoTIFF Locator — User Guide",
      lede: "A guide to the tool that reads the four corner coordinates from a GeoTIFF topographic map and plots the matching extent on a map. Everything runs in your browser — the file is never uploaded anywhere.",

      s1Title: "Overview",
      s1P1: "This tool reads a GeoTIFF (a topographic map, aerial photo, or similar raster) and automatically computes the latitude/longitude of its four corners from the georeferencing embedded in the file (the affine transform and EPSG code). The result is plotted on GSI's standard map or OpenStreetMap as a bounding polygon, corner markers, and the source image itself as a semi-transparent overlay.",

        ["What file formats are supported?", "GeoTIFF files with a .tif or .tiff extension. The file needs embedded georeferencing (GeoKeys plus ModelPixelScale/ModelTiepoint or ModelTransformation). Plain JPEG, PNG, or a TIFF with no georeferencing aren't supported."],
        ["The thumbnail doesn't show up", "Very large files or unusual band configurations (palette color, 16-bit+, uncommon compression) can fail to generate a thumbnail. The corner coordinate calculation and map display still work even when that happens."],
        ["It says “No CRS info”", "The GeoTIFF itself is likely missing the affine transform information (ModelPixelScale/ModelTiepoint, etc.). In that case the corner coordinates can't be computed at all, so manual CRS selection can't recover it either. You'll need to re-set the georeferencing in whatever software produced the file."],
        ["Is there a file size limit?", "There's no hard limit, but larger files use more of your browser's memory. Files over a few hundred MB may make the browser sluggish."],
      ],
      footer: "This tool and manual are meant as a convenience aid for checking a topographic map's location. They are not intended as a certified survey product or an official proof of position.",
    },
  };

  const LANG_STORAGE_KEY = "topoGeotiffLang";
  let lang = "ja";
  try {
    const saved = localStorage.getItem(LANG_STORAGE_KEY);
    if (saved === "ja" || saved === "en") lang = saved;
  } catch (e) {}

  const $ = (id) => document.getElementById(id);

  function renderList(el, items) {
    el.innerHTML = "";
    for (const item of items) {
      const li = document.createElement("li");
      li.textContent = item;
      el.appendChild(li);
    }
  }

  function renderSteps(el, steps) {
    el.innerHTML = "";
    for (const s of steps) {
      const li = document.createElement("li");
      const h = document.createElement("h3");
      h.style.margin = "0 0 4px";
      h.style.fontSize = "14.5px";
      h.textContent = s.h;
      const p = document.createElement("p");
      p.style.margin = "0";
      p.style.color = "var(--muted)";
      p.textContent = s.p;
      li.appendChild(h);
      li.appendChild(p);
      el.appendChild(li);
    }
  }

  function renderTable(theadEl, tbodyEl, head, rows) {
    theadEl.innerHTML = head.map(h => `<th>${h}</th>`).join("");
    tbodyEl.innerHTML = "";
    for (const row of rows) {
      const tr = document.createElement("tr");
      tr.innerHTML = row.map(c => `<td>${c}</td>`).join("");
      tbodyEl.appendChild(tr);
    }
  }

  function renderFaq(el, items) {
    el.innerHTML = "";
    for (const [q, a] of items) {
      const dt = document.createElement("dt");
      dt.textContent = q;
      const dd = document.createElement("dd");
      dd.textContent = a;
      el.appendChild(dt);
      el.appendChild(dd);
    }
  }

  function applyStaticText() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = lang === "ja" ? "地形図GeoTIFF位置確認 マニュアル" : "Topo GeoTIFF Locator — Manual";

    $("t-eyebrow").textContent = t.eyebrow;
    $("t-h1").textContent = t.h1;
    $("t-lede").textContent = t.lede;
    $("t-openTool").textContent = t.openTool;

    $("t-s1-title").textContent = t.s1Title;
    $("t-s1-p1").textContent = t.s1P1;
    $("t-s1-p2").textContent = t.s1P2;
    renderList($("t-s1-list"), t.s1List);

    $("t-s2-title").textContent = t.s2Title;
    renderSteps($("t-s2-steps"), t.s2Steps);

    $("t-s3-title").textContent = t.s3Title;
    $("t-s3-p1").textContent = t.s3P1;
    renderTable($("t-s3-thead"), $("t-s3-tbody"), t.s3TableHead, t.s3TableRows);
    $("t-s3-note").innerHTML = t.s3Note;

    $("t-s4-title").textContent = t.s4Title;
    $("t-s4-warn1").innerHTML = t.s4Warn1;
    $("t-s4-warn2").innerHTML = t.s4Warn2;
    $("t-s4-p1").textContent = t.s4P1;

    $("t-s5-title").textContent = t.s5Title;
    $("t-s5-p1").textContent = t.s5P1;

    $("t-s6-title").textContent = t.s6Title;
    renderFaq($("t-s6-faq"), t.s6Faq);

    $("t-footer").textContent = t.footer;

    $("langJa").classList.toggle("active", lang === "ja");
    $("langEn").classList.toggle("active", lang === "en");
    $("langJa").setAttribute("aria-pressed", String(lang === "ja"));
    $("langEn").setAttribute("aria-pressed", String(lang === "en"));
  }

  function setLang(next) {
    if (next !== "ja" && next !== "en") return;
    if (next === lang) return;
    lang = next;
    try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch (e) {}
    applyStaticText();
  }
  $("langJa").addEventListener("click", () => setLang("ja"));
  $("langEn").addEventListener("click", () => setLang("en"));

  applyStaticText();
})();
</script>

</body>
</html>
