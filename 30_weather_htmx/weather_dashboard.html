<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Weather Dashboard - Open-Meteo</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
    }
    body {
      margin: 0;
      padding: 2rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: monospace, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }
    h1 {
      margin: 0;
      color: var(--accent-color);
      font-size: 1.5rem;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .weather-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }
    .card-header {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }
    .weather-body {
      font-size: 1.05rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .weather-body.loading {
      color: #8b949e;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Japan Weather Monitor</h1>
    <div style="font-size: 0.85rem; color: #8b949e;">
      Powered by Open-Meteo
    </div>
  </header>
  <div class="dashboard-grid">
    <!-- Sapporo -->
    <div class="weather-card">
      <div class="card-header">札幌 (Sapporo)</div>
      <div class="weather-body loading" id="weather-sapporo" data-lat="43.0618" data-lon="141.3545" data-delay="0">
        Loading weather...
      </div>
    </div>
    <!-- Tokyo -->
    <div class="weather-card">
      <div class="card-header">東京 (Tokyo)</div>
      <div class="weather-body loading" id="weather-tokyo" data-lat="35.6895" data-lon="139.6917" data-delay="300">
        Loading weather...
      </div>
    </div>
    <!-- Osaka -->
    <div class="weather-card">
      <div class="card-header">大阪 (Osaka)</div>
      <div class="weather-body loading" id="weather-osaka" data-lat="34.6937" data-lon="135.5023" data-delay="600">
        Loading weather...
      </div>
    </div>
    <!-- Fukuoka -->
    <div class="weather-card">
      <div class="card-header">福岡 (Fukuoka)</div>
      <div class="weather-body loading" id="weather-fukuoka" data-lat="33.5904" data-lon="130.4017" data-delay="900">
        Loading weather...
      </div>
    </div>
    <!-- Naha -->
    <div class="weather-card">
      <div class="card-header">那覇 (Naha)</div>
      <div class="weather-body loading" id="weather-naha" data-lat="26.2124" data-lon="127.6809" data-delay="1200">
        Loading weather...
      </div>
    </div>
  </div>

  <script>
    // WMO weather code -> emoji + Japanese label (per Open-Meteo docs)
    var WEATHER_CODES = {
      0: "☀️ 快晴", 1: "🌤️ ほぼ晴れ", 2: "⛅ 一部曇り", 3: "☁️ 曇り",
      45: "🌫️ 霧", 48: "🌫️ 霧(着氷)",
      51: "🌦️ 弱い霧雨", 53: "🌦️ 霧雨", 55: "🌦️ 強い霧雨",
      56: "🌧️ 着氷性の霧雨", 57: "🌧️ 強い着氷性の霧雨",
      61: "🌧️ 弱い雨", 63: "🌧️ 雨", 65: "🌧️ 強い雨",
      66: "🌧️ 着氷性の雨", 67: "🌧️ 強い着氷性の雨",
      71: "🌨️ 弱い雪", 73: "🌨️ 雪", 75: "🌨️ 強い雪", 77: "🌨️ 霧雪",
      80: "🌦️ 弱いにわか雨", 81: "🌦️ にわか雨", 82: "🌦️ 激しいにわか雨",
      85: "🌨️ 弱いにわか雪", 86: "🌨️ 強いにわか雪",
      95: "⛈️ 雷雨", 96: "⛈️ 雷雨(雹)", 99: "⛈️ 激しい雷雨(雹)"
    };

    var REFRESH_INTERVAL_MS = 600 * 1000; // 10 minutes, same cadence as before

    function formatWeather(data) {
      var c = data.current;
      var desc = WEATHER_CODES[c.weather_code] || ("不明(code:" + c.weather_code + ")");
      return desc + " " + c.temperature_2m + "°C (体感 " + c.apparent_temperature + "°C)\n" +
             "風: " + c.wind_speed_10m + "km/h\n" +
             "湿度: " + c.relative_humidity_2m + "%\n" +
             "降水量: " + c.precipitation + "mm";
    }

    function loadWeather(el) {
      var lat = el.dataset.lat;
      var lon = el.dataset.lon;
      var url = "https://api.open-meteo.com/v1/forecast" +
                "?latitude=" + lat +
                "&longitude=" + lon +
                "&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
                "&timezone=" + encodeURIComponent("Asia/Tokyo");

      fetch(url)
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        })
        .then(function (data) {
          el.textContent = formatWeather(data);
          el.classList.remove("loading");
        })
        .catch(function (err) {
          el.textContent = "⚠️ 取得失敗。しばらくして再読込されます。(" + err.message + ")";
        });
    }

    function startPolling(el) {
      var delay = parseInt(el.dataset.delay, 10) || 0;
      setTimeout(function () {
        loadWeather(el);
        setInterval(function () {
          loadWeather(el);
        }, REFRESH_INTERVAL_MS);
      }, delay);
    }

    document.addEventListener("DOMContentLoaded", function () {
      var cards = document.querySelectorAll(".weather-body[data-lat]");
      cards.forEach(startPolling);
    });
  </script>
</body>
</html>
