<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Weather Dashboard - HTMX & wttr.in</title>
  <!-- Load HTMX via CDN -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    // Remove custom HTMX headers to avoid preflight CORS restrictions
    document.addEventListener("htmx:configRequest", (event) => {
      delete event.detail.headers["HX-Request"];
      delete event.detail.headers["HX-Trigger"];
      delete event.detail.headers["HX-Target"];
      delete event.detail.headers["HX-Current-URL"];
    });
  </script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
    }

    body {
      margin: 0;
      padding: 2rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: monospace, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    h1 {
      margin: 0;
      color: var(--accent-color);
      font-size: 1.5rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .weather-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .weather-body {
      font-size: 1.05rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .htmx-indicator {
      display: none;
      color: #8b949e;
      font-size: 0.9rem;
    }
    .htmx-request .htmx-indicator {
      display: inline-block;
    }
  </style>
</head>
<body>

  <header>
    <h1>Japan Weather Monitor</h1>
    <div style="font-size: 0.85rem; color: #8b949e;">
      Powered by wttr.in & htmx
    </div>
  </header>

  <div class="dashboard-grid">

    <!-- Sapporo (Starts immediately) -->
    <div class="weather-card">
      <div class="card-header">札幌 (Sapporo)</div>
      <div class="weather-body"
           hx-get="https://corsproxy.io/?https://wttr.in/Sapporo?format=%c+%t+(体感+%f)%0A風:+%w%0A湿度:+%h%0A降水量:+%p&lang=ja"
           hx-trigger="load, every 600s"
           hx-swap="innerHTML">
        <span class="htmx-indicator">Loading weather...</span>
      </div>
    </div>

    <!-- Tokyo (Delayed 300ms) -->
    <div class="weather-card">
      <div class="card-header">東京 (Tokyo)</div>
      <div class="weather-body"
           hx-get="https://corsproxy.io/?https://wttr.in/Tokyo?format=%c+%t+(体感+%f)%0A風:+%w%0A湿度:+%h%0A降水量:+%p&lang=ja"
           hx-trigger="load delay:300ms, every 600s"
           hx-swap="innerHTML">
        <span class="htmx-indicator">Loading weather...</span>
      </div>
    </div>

    <!-- Osaka (Delayed 600ms) -->
    <div class="weather-card">
      <div class="card-header">大阪 (Osaka)</div>
      <div class="weather-body"
           hx-get="https://corsproxy.io/?https://wttr.in/Osaka?format=%c+%t+(体感+%f)%0A風:+%w%0A湿度:+%h%0A降水量:+%p&lang=ja"
           hx-trigger="load delay:600ms, every 600s"
           hx-swap="innerHTML">
        <span class="htmx-indicator">Loading weather...</span>
      </div>
    </div>

    <!-- Fukuoka (Delayed 900ms) -->
    <div class="weather-card">
      <div class="card-header">福岡 (Fukuoka)</div>
      <div class="weather-body"
           hx-get="https://corsproxy.io/?https://wttr.in/Fukuoka?format=%c+%t+(体感+%f)%0A風:+%w%0A湿度:+%h%0A降水量:+%p&lang=ja"
           hx-trigger="load delay:900ms, every 600s"
           hx-swap="innerHTML">
        <span class="htmx-indicator">Loading weather...</span>
      </div>
    </div>

    <!-- Naha (Delayed 1200ms) -->
    <div class="weather-card">
      <div class="card-header">那覇 (Naha)</div>
      <div class="weather-body"
           hx-get="https://corsproxy.io/?https://wttr.in/Naha?format=%c+%t+(体感+%f)%0A風:+%w%0A湿度:+%h%0A降水量:+%p&lang=ja"
           hx-trigger="load delay:1200ms, every 600s"
           hx-swap="innerHTML">
        <span class="htmx-indicator">Loading weather...</span>
      </div>
    </div>

  </div>

</body>
</html>
