<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World News Reader</title>
<meta name="description" content="A static news reader for the NYT World RSS feed, with search and dark mode.">
<script>
  // Apply the saved theme before first paint to avoid a flash of the wrong theme
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* storage may be blocked; fall back to the OS setting */ }
  })();
</script>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #efede7;
    --text: #1b1b1b;
    --muted: #6a6a66;
    --border: #e3e0d8;
    --accent: #2b5f8f;
    --focus: #2b5f8f;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
    --shadow-hover: 0 2px 4px rgba(0,0,0,.07), 0 10px 26px rgba(0,0,0,.10);
    --warn-bg: #fff4d6;
    --warn-text: #6b4e00;
    --serif: Georgia, "Times New Roman", "Noto Serif", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212;
      --surface: #1c1c1c;
      --surface-2: #262626;
      --text: #ececea;
      --muted: #9a9a95;
      --border: #303030;
      --accent: #7fb2e5;
      --focus: #7fb2e5;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
      --shadow-hover: 0 2px 4px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.45);
      --warn-bg: #3a2f10;
      --warn-text: #f0d78a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212;
    --surface: #1c1c1c;
    --surface-2: #262626;
    --text: #ececea;
    --muted: #9a9a95;
    --border: #303030;
    --accent: #7fb2e5;
    --focus: #7fb2e5;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    --shadow-hover: 0 2px 4px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.45);
    --warn-bg: #3a2f10;
    --warn-text: #f0d78a;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  header.site {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .bar { display: flex; align-items: center; gap: 12px; padding-block: 12px; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
  .brand h1 { margin: 0; font-family: var(--serif); font-size: 1.35rem; letter-spacing: -.01em; line-height: 1.2; }
  .brand .sub { font-size: .78rem; color: var(--muted); }

  .search { position: relative; flex: 1 1 260px; max-width: 420px; }
  .search input {
    width: 100%; height: 40px; padding: 0 44px 0 38px;
    font: inherit; font-size: .95rem; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .search input::placeholder { color: var(--muted); }
  .search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .search kbd {
    position: absolute; right: 10px; top: 50%; translate: 0 -50%;
    font: .72rem var(--sans); color: var(--muted);
    border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; background: var(--surface-2);
    pointer-events: none;
  }
  .search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }

  .icon-btn {
    display: inline-grid; place-items: center; width: 40px; height: 40px;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .sun { display: none; }
  :root[data-theme="dark"] .icon-btn .sun { display: block; }
  :root[data-theme="dark"] .icon-btn .moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .icon-btn .sun { display: block; }
    :root:not([data-theme="light"]) .icon-btn .moon { display: none; }
  }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .search input:focus-visible { outline-offset: 0; }

  /* Status line and notices */
  .status { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 18px 0 14px; font-size: .85rem; color: var(--muted); }
  .notice { margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-text); font-size: .88rem; }
  .notice code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85em; }

  /* Card grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; padding-bottom: 56px; }
  .card {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); transition: box-shadow .18s, transform .18s;
  }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
  .card a.hit { display: flex; flex-direction: column; height: 100%; color: inherit; text-decoration: none; }
  .thumb { aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.empty { display: grid; place-items: center; color: var(--muted); font-family: var(--serif); font-size: 1.6rem; letter-spacing: .04em; }
  .body { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; flex: 1; }
  .meta { font-size: .76rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
  .meta .sep::before { content: "\00b7"; margin-right: 6px; }
  .card h2 { margin: 0; font-family: var(--serif); font-size: 1.12rem; line-height: 1.3; font-weight: 700; }
  .card a.hit:hover h2 { color: var(--accent); }
  .card p {
    margin: 0; font-size: .9rem; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tags { margin-top: auto; padding-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: .7rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

  .empty-state { grid-column: 1 / -1; text-align: center; padding: 56px 16px; color: var(--muted); }
  .empty-state strong { display: block; color: var(--text); font-family: var(--serif); font-size: 1.2rem; margin-bottom: 6px; }

  /* Skeleton loading cards */
  .skel .thumb { animation: pulse 1.2s ease-in-out infinite; }
  .skel .line { height: 12px; border-radius: 6px; background: var(--surface-2); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .skel .thumb, .skel .line { animation: none; }
  }

  footer { border-top: 1px solid var(--border); padding: 20px 0 32px; font-size: .8rem; color: var(--muted); }
  footer a { color: inherit; }

  @media (max-width: 560px) {
    .search { order: 3; flex-basis: 100%; max-width: none; }
    .brand h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<header class="site">
  <div class="wrap bar">
    <div class="brand">
      <h1>World News Reader</h1>
      <span class="sub" id="updated">Loading&hellip;</span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search headlines, authors, topics" autocomplete="off" aria-label="Search stories">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div id="notice-slot"></div>
  <div class="status"><span id="count" aria-live="polite"></span><span id="source"></span></div>
  <div class="grid" id="grid" aria-busy="true"></div>
</main>

<footer>
  <div class="wrap">
    Headlines and summaries are provided via the
    <a href="https://www.nytimes.com/rss" target="_blank" rel="noopener noreferrer">New York Times World RSS feed</a>.
    Each card links to the original article. This site is not affiliated with The New York Times.
  </div>
</footer>

<script>
  "use strict";

  var DATA_URL = "data/news.json";
  var state = { items: [], query: "" };

  var grid = document.getElementById("grid");
  var qInput = document.getElementById("q");
  var countEl = document.getElementById("count");
  var updatedEl = document.getElementById("updated");
  var sourceEl = document.getElementById("source");
  var noticeSlot = document.getElementById("notice-slot");

  // ---------- helpers ----------

  // Only allow http(s) URLs coming from the feed (blocks javascript: and similar)
  function safeUrl(u) {
    try {
      var url = new URL(u, location.href);
      return (url.protocol === "https:" || url.protocol === "http:") ? url.href : "";
    } catch (e) { return ""; }
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  var rtf = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
  var dateFmt = new Intl.DateTimeFormat("en", { month: "short", day: "numeric", year: "numeric" });
  var dateTimeFmt = new Intl.DateTimeFormat("en", { dateStyle: "medium", timeStyle: "short" });

  // "5 minutes ago" for recent items, a plain date for older ones
  function formatTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var diffSec = Math.round((d.getTime() - Date.now()) / 1000);
    var abs = Math.abs(diffSec);
    if (abs < 60) return "just now";
    if (abs < 3600) return rtf.format(Math.round(diffSec / 60), "minute");
    if (abs < 86400) return rtf.format(Math.round(diffSec / 3600), "hour");
    if (abs < 7 * 86400) return rtf.format(Math.round(diffSec / 86400), "day");
    return dateFmt.format(d);
  }

  // ---------- rendering ----------

  function renderCard(item) {
    var card = el("article", "card");
    var a = el("a", "hit");
    a.href = safeUrl(item.link) || "#";
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    var thumb = el("div", "thumb");
    var imgUrl = safeUrl(item.image);
    if (imgUrl) {
      var img = document.createElement("img");
      img.src = imgUrl;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      img.referrerPolicy = "no-referrer";
      // Fall back to a plain placeholder if the image fails to load
      img.onerror = function () { thumb.className = "thumb empty"; thumb.textContent = "World"; };
      thumb.appendChild(img);
    } else {
      thumb.className = "thumb empty";
      thumb.textContent = "World";
    }
    a.appendChild(thumb);

    var body = el("div", "body");
    var meta = el("div", "meta");
    var when = formatTime(item.published);
    if (item.author) meta.appendChild(el("span", "", item.author));
    if (when) {
      var t = el("time", item.author ? "sep" : "", when);
      t.dateTime = item.published;
      t.title = dateTimeFmt.format(new Date(item.published));
      meta.appendChild(t);
    }
    if (meta.childNodes.length) body.appendChild(meta);

    body.appendChild(el("h2", "", item.title));
    if (item.summary) body.appendChild(el("p", "", item.summary));

    if (item.categories && item.categories.length) {
      var tags = el("div", "tags");
      item.categories.slice(0, 3).forEach(function (c) { tags.appendChild(el("span", "tag", c)); });
      body.appendChild(tags);
    }

    a.appendChild(body);
    card.appendChild(a);
    return card;
  }

  function renderSkeleton() {
    grid.setAttribute("aria-busy", "true");
    grid.textContent = "";
    for (var i = 0; i < 8; i++) {
      var card = el("article", "card skel");
      card.appendChild(el("div", "thumb"));
      var body = el("div", "body");
      ["60%", "100%", "90%", "75%"].forEach(function (w) {
        var line = el("div", "line");
        line.style.width = w;
        body.appendChild(line);
      });
      card.appendChild(body);
      grid.appendChild(card);
    }
  }

  function matches(item, terms) {
    var hay = item._hay;
    for (var i = 0; i < terms.length; i++) {
      if (hay.indexOf(terms[i]) === -1) return false;
    }
    return true;
  }

  function render() {
    var terms = state.query.toLowerCase().split(/\s+/).filter(Boolean);
    var list = terms.length ? state.items.filter(function (it) { return matches(it, terms); }) : state.items;

    grid.setAttribute("aria-busy", "false");
    grid.textContent = "";

    if (!list.length) {
      var empty = el("div", "empty-state");
      empty.appendChild(el("strong", "", "No stories found"));
      empty.appendChild(el("span", "", state.items.length ? "Try a different keyword." : "There is nothing to show yet."));
      grid.appendChild(empty);
    } else {
      var frag = document.createDocumentFragment();
      list.forEach(function (it) { frag.appendChild(renderCard(it)); });
      grid.appendChild(frag);
    }

    countEl.textContent = terms.length
      ? list.length + " of " + state.items.length + " stories"
      : state.items.length + " stories";
  }

  function showNotice(nodes) {
    noticeSlot.textContent = "";
    var box = el("div", "notice");
    nodes.forEach(function (n) { box.appendChild(typeof n === "string" ? document.createTextNode(n) : n); });
    noticeSlot.appendChild(box);
  }

  // ---------- data loading ----------

  function load() {
    renderSkeleton();
    return fetch(DATA_URL, { cache: "no-cache" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        state.items = (data.items || []).map(function (it) {
          // Precompute the lowercase search text once per item
          it._hay = [it.title, it.summary, it.author, (it.categories || []).join(" ")].join(" ").toLowerCase();
          return it;
        });

        if (data.fetched_at) {
          updatedEl.textContent = "Updated " + dateTimeFmt.format(new Date(data.fetched_at));
        } else {
          updatedEl.textContent = data.title || "";
        }
        if (data.title) sourceEl.textContent = data.title;

        if (data.sample) {
          var cmd = el("code", "", "python3 scripts/fetch_news.py");
          showNotice(["This is placeholder sample data. Run ", cmd, " (or wait for the scheduled workflow) to load the real feed."]);
        }
        render();
      })
      .catch(function (err) {
        grid.setAttribute("aria-busy", "false");
        grid.textContent = "";
        updatedEl.textContent = "Could not load news";
        var cmd = el("code", "", "python3 -m http.server");
        showNotice(["Failed to load ", el("code", "", DATA_URL), " (" + err.message + "). If you opened the file directly, serve the folder instead, e.g. ", cmd, "."]);
        countEl.textContent = "";
      });
  }

  // ---------- search ----------

  var debounce;
  qInput.addEventListener("input", function () {
    clearTimeout(debounce);
    debounce = setTimeout(function () { state.query = qInput.value; render(); }, 120);
  });

  // "/" focuses the search box; Esc clears it
  document.addEventListener("keydown", function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") {
      e.preventDefault();
      qInput.focus();
    } else if (e.key === "Escape" && document.activeElement === qInput) {
      qInput.value = "";
      state.query = "";
      render();
      qInput.blur();
    }
  });

  // ---------- theme ----------

  document.getElementById("theme").addEventListener("click", function () {
    var root = document.documentElement;
    var current = root.getAttribute("data-theme");
    if (!current) current = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    var next = current === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) { /* ignore */ }
  });

  load();
</script>
</body>
</html>
