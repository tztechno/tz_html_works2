name: Update news

on:
  schedule:
    # Every 30 minutes (UTC); GitHub may delay scheduled runs slightly
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script uses only the standard library, so no dependencies are installed
      - name: Fetch feed and write data/news.json
        run: python3 scripts/fetch_news.py

      # Commit only when the content actually changed (fetched_at alone is ignored)
      - name: Commit if changed
        run: |
          if git diff --quiet -I'"fetched_at"' -- data/news.json; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: update news data"
          git push
