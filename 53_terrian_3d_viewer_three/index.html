<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain 3D Viewer (three.js)</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <aside id="sidebar">
      <h1>Terrain 3D Viewer <small>three.js</small></h1>

      <label id="drop" class="drop">
        <input id="file" type="file" accept=".tif,.tiff" hidden />
        <span id="dropText">DEM GeoTIFF をドロップ<br />またはクリックして選択</span>
      </label>

      <label>Aerial imagery
        <select id="source"></select>
      </label>
      <label>Mesh resolution <output id="maxDimOut"></output>
        <input id="maxDim" type="range" min="100" max="1000" step="50" value="400" />
      </label>
      <label>Max imagery tiles <output id="maxTilesOut"></output>
        <input id="maxTiles" type="range" min="4" max="1024" step="4" value="256" />
      </label>
      <label>Vertical exaggeration <output id="vExagOut"></output>
        <input id="vExag" type="range" min="0.5" max="10" step="0.5" value="1.5" />
      </label>
      <label>Surface
        <select id="surface">
          <option value="photo">Aerial photo</option>
          <option value="elevation">Elevation colors</option>
          <option value="hillshade">Hillshade</option>
        </select>
      </label>
      <label>Relief shading <output id="shadingOut"></output>
        <input id="shading" type="range" min="0" max="1" step="0.05" value="0.4" />
      </label>
      <label class="row"><input id="contours" type="checkbox" /> Contour lines</label>
      <label class="row"><input id="walls" type="checkbox" checked /> Base walls</label>
      <label class="row"><input id="grid" type="checkbox" /> Ground grid</label>

      <div id="status"></div>
      <dl id="stats"></dl>
      <div class="buttons">
        <button id="png" disabled>Save PNG</button>
        <button id="glb" disabled>Download GLB (3D model)</button>
        <button id="download" disabled>Download standalone HTML</button>
      </div>
      <a class="manual" href="./MANUAL.md">Manual</a>
    </aside>
    <main id="plot"><div class="placeholder">GeoTIFF を読み込むと、ここに 3D 地形が表示されます</div></main>
  </body>
</html>
