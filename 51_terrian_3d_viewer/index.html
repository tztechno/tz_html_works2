<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain 3D Viewer</title>
  </head>
  <body>
    <aside id="sidebar">
      <h1>Terrain 3D Viewer</h1>

      <label id="drop" class="drop">
        <input id="file" type="file" accept=".tif,.tiff" hidden />
        <span id="dropText">DEM GeoTIFF をドロップ<br />またはクリックして選択</span>
      </label>

      <label>Aerial imagery
        <select id="source"></select>
      </label>
      <label>Mesh resolution <output id="maxDimOut"></output>
        <input id="maxDim" type="range" min="100" max="600" step="50" value="300" />
      </label>
      <label>Vertical exaggeration <output id="vExagOut"></output>
        <input id="vExag" type="range" min="0.5" max="10" step="0.5" value="1.5" />
      </label>
      <label>Max imagery tiles <output id="maxTilesOut"></output>
        <input id="maxTiles" type="range" min="4" max="256" step="4" value="64" />
      </label>
      <label class="row"><input id="axes" type="checkbox" checked /> Show axes</label>

      <div id="status"></div>
      <dl id="stats"></dl>
      <button id="download" disabled>Download standalone HTML</button>
    </aside>
    <main id="plot"><div class="placeholder">GeoTIFF を読み込むと、ここに 3D 地形が表示されます</div></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
