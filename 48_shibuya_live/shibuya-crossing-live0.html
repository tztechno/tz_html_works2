<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>渋谷スクランブル交差点</title>
<meta name="description" content="Live YouTube feed of Shibuya Scramble Crossing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --bg: #f6f3ec;
    --surface: #ffffff;
    --surface-line: #e2ddd0;
    --text: #16161c;
    --text-muted: #6b6a72;
    --accent-pink: #d81b60;
    --accent-cyan: #0e8a82;
    --glow: rgba(216, 27, 96, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0b10;
      --surface: #12141d;
      --surface-line: #23273a;
      --text: #f2f1eb;
      --text-muted: #8c8fa3;
      --accent-pink: #ff3f7f;
      --accent-cyan: #2ee6c8;
      --glow: rgba(255, 63, 127, 0.28);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0a0b10;
    --surface: #12141d;
    --surface-line: #23273a;
    --text: #f2f1eb;
    --text-muted: #8c8fa3;
    --accent-pink: #ff3f7f;
    --accent-cyan: #2ee6c8;
    --glow: rgba(255, 63, 127, 0.28);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    padding-inline: 20px;
    padding-block: 40px;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--accent-pink);
    text-transform: uppercase;
  }

  .eyebrow .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-pink);
    box-shadow: 0 0 0 4px var(--glow);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow .dot { animation: none; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  h1 {
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: clamp(28px, 5vw, 42px);
    margin: 0;
    text-wrap: balance;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0;
  }

  .frame {
    position: relative;
    aspect-ratio: 16 / 9;
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--surface-line);
    box-shadow: 0 0 0 1px var(--surface-line), 0 24px 60px -30px var(--glow);
  }

  .frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 12px;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .meta-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .meta-value {
    font-family: "JetBrains Mono", monospace;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    color: var(--accent-cyan);
  }

  a.source-link {
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    border-bottom: 1px solid var(--accent-pink);
    padding-bottom: 1px;
  }

  a.source-link:hover { color: var(--accent-pink); }

  a.source-link:focus-visible,
  .frame iframe:focus-visible {
    outline: 2px solid var(--accent-cyan);
    outline-offset: 2px;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
  }
</style>
</head>
<body>

<main>
  <header>
    <span class="eyebrow"><span class="dot"></span>Live</span>
    <h1>渋谷スクランブル交差点</h1>
    <p class="subtitle">Shibuya Scramble Crossing — live camera, streamed via YouTube</p>
  </header>

  <div class="frame">
    <iframe
      src="https://www.youtube-nocookie.com/embed/8H3nRCFVR6Y?si=W85LvfNCKzVk91_K"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </div>

  <div class="meta">
    <div class="meta-item">
      <span class="meta-label">Tokyo time</span>
      <span class="meta-value" id="clock">--:--:--</span>
    </div>
    <a class="source-link" href="https://www.youtube.com/watch?v=8H3nRCFVR6Y" target="_blank" rel="noopener">YouTubeで開く ↗</a>
  </div>

  <footer>渋谷スクランブル交差点のライブ配信映像です。配信元の状況により映像が停止する場合があります。</footer>
</main>

<script>
  (function () {
    var el = document.getElementById('clock');
    function tick() {
      try {
        var now = new Date().toLocaleTimeString('ja-JP', {
          timeZone: 'Asia/Tokyo',
          hour12: false
        });
        el.textContent = now;
      } catch (e) {
        el.textContent = new Date().toLocaleTimeString();
      }
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
