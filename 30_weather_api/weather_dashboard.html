<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Weather Dashboard - Open-Meteo</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
    }
    body {
      margin: 0;
      padding: 2rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: monospace, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }
    h1 {
      margin: 0;
      color: var(--accent-color);
      font-size: 1.5rem;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .weather-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }
    .card-header {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }
    .weather-body {
      font-size: 1.05rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .weather-body.loading {
      color: #8b949e;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Japan Weather Monitor</h1>
    <div style="font-size: 0.85rem; color: #8b949e;">
      Powered by Open-Meteo
    </div>
  </header>
  <div class="dashboard-grid" id="dashboard-grid"></div>

  <script>
    // City list: [Japanese label, English label, lat, lon]
    // Covers all regions of Japan, north to south.
    var CITIES = [
      ["札幌", "Sapporo",    43.0618, 141.3545],
      ["仙台", "Sendai",     38.2682, 140.8694],
      ["東京", "Tokyo",      35.6895, 139.6917],
      ["横浜", "Yokohama",   35.4437, 139.6380],
      ["新潟", "Niigata",    37.9161, 139.0364],
      ["金沢", "Kanazawa",   36.5613, 136.6562],
      ["名古屋", "Nagoya",   35.1815, 136.9066],
      ["静岡", "Shizuoka",   34.9756, 138.3827],
      ["京都", "Kyoto",      35.0116, 135.7681],
      ["大阪", "Osaka",      34.6937, 135.5023],
      ["神戸", "Kobe",       34.6901, 135.1955],
      ["広島", "Hiroshima",  34.3853, 132.4553],
      ["松山", "Matsuyama",  33.8392, 132.7657],
      ["福岡", "Fukuoka",    33.5904, 130.4017],
      ["鹿児島", "Kagoshima", 31.5966, 130.5571],
      ["那覇", "Naha",       26.2124, 127.6809]
    ];

    var STAGGER_MS = 300;          // gap between each city's first request
    var REFRESH_INTERVAL_MS = 600 * 1000; // 10 minutes

    // WMO weather code -> emoji + Japanese label (per Open-Meteo docs)
    var WEATHER_CODES = {
      0: "☀️ 快晴", 1: "🌤️ ほぼ晴れ", 2: "⛅ 一部曇り", 3: "☁️ 曇り",
      45: "🌫️ 霧", 48: "🌫️ 霧(着氷)",
      51: "🌦️ 弱い霧雨", 53: "🌦️ 霧雨", 55: "🌦️ 強い霧雨",
      56: "🌧️ 着氷性の霧雨", 57: "🌧️ 強い着氷性の霧雨",
      61: "🌧️ 弱い雨", 63: "🌧️ 雨", 65: "🌧️ 強い雨",
      66: "🌧️ 着氷性の雨", 67: "🌧️ 強い着氷性の雨",
      71: "🌨️ 弱い雪", 73: "🌨️ 雪", 75: "🌨️ 強い雪", 77: "🌨️ 霧雪",
      80: "🌦️ 弱いにわか雨", 81: "🌦️ にわか雨", 82: "🌦️ 激しいにわか雨",
      85: "🌨️ 弱いにわか雪", 86: "🌨️ 強いにわか雪",
      95: "⛈️ 雷雨", 96: "⛈️ 雷雨(雹)", 99: "⛈️ 激しい雷雨(雹)"
    };

    function buildCards() {
      var grid = document.getElementById("dashboard-grid");
      CITIES.forEach(function (city, i) {
        var jp = city[0], en = city[1], lat = city[2], lon = city[3];
        var card = document.createElement("div");
        card.className = "weather-card";

        var header = document.createElement("div");
        header.className = "card-header";
        header.textContent = jp + " (" + en + ")";

        var body = document.createElement("div");
        body.className = "weather-body loading";
        body.id = "weather-" + en.toLowerCase();
        body.dataset.lat = lat;
        body.dataset.lon = lon;
        body.dataset.delay = i * STAGGER_MS;
        body.textContent = "Loading weather...";

        card.appendChild(header);
        card.appendChild(body);
        grid.appendChild(card);
      });
    }

    // hourly.precipitation[i] is the "preceding hour sum" ending at
    // hourly.time[i] (per Open-Meteo docs) -- i.e. the value at the most
    // recent past-or-present timestamp is the last FULLY COMPLETED hour's
    // precipitation total. We report that as mm/h.
    // data.current.time and data.hourly.time share the same local
    // (timezone=Asia/Tokyo) naive-ISO format, so a plain string compare
    // against current.time avoids any separate "what time is it" logic.
    function latestCompletedHourPrecip(data) {
      var hourly = data.hourly;
      var now = data.current.time;
      var bestIndex = -1;
      for (var i = 0; i < hourly.time.length; i++) {
        if (hourly.time[i] <= now) {
          bestIndex = i;
        }
      }
      if (bestIndex === -1) bestIndex = 0;
      return { value: hourly.precipitation[bestIndex], time: hourly.time[bestIndex] };
    }

    function formatWeather(data) {
      var c = data.current;
      var precip = latestCompletedHourPrecip(data);
      var desc = WEATHER_CODES[c.weather_code] || ("不明(code:" + c.weather_code + ")");
      return desc + " " + c.temperature_2m + "°C (体感 " + c.apparent_temperature + "°C)\n" +
             "風: " + c.wind_speed_10m + "km/h\n" +
             "湿度: " + c.relative_humidity_2m + "%\n" +
             "降水量(直近1h): " + precip.value + "mm/h";
    }

    function loadWeather(el) {
      var lat = el.dataset.lat;
      var lon = el.dataset.lon;
      var url = "https://api.open-meteo.com/v1/forecast" +
                "?latitude=" + lat +
                "&longitude=" + lon +
                "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m" +
                "&hourly=precipitation&past_hours=2&forecast_days=1" +
                "&timezone=" + encodeURIComponent("Asia/Tokyo");

      fetch(url)
        .then(function (response) {
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          return response.json();
        })
        .then(function (data) {
          el.textContent = formatWeather(data);
          el.classList.remove("loading");
        })
        .catch(function (err) {
          el.textContent = "⚠️ 取得失敗。しばらくして再読込されます。(" + err.message + ")";
        });
    }

    function startPolling(el) {
      var delay = parseInt(el.dataset.delay, 10) || 0;
      setTimeout(function () {
        loadWeather(el);
        setInterval(function () {
          loadWeather(el);
        }, REFRESH_INTERVAL_MS);
      }, delay);
    }

    document.addEventListener("DOMContentLoaded", function () {
      buildCards();
      var cards = document.querySelectorAll(".weather-body[data-lat]");
      cards.forEach(startPolling);
    });
  </script>
</body>
</html>
