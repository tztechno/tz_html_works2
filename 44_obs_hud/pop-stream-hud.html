<title>Pop Stream HUD</title>
<style>
  /* ---------------------------------------------------------------
     Font imports (Google Fonts is the only allowed external stylesheet host)
  --------------------------------------------------------------- */
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  /* ---------------------------------------------------------------
     Tokens
     This page is an OBS Browser Source overlay: its core function
     requires a transparent page background at all times (both in
     edit mode and in "clean" mode), so body background is
     intentionally NOT a theme token like a normal artifact would use.
     All other UI (settings panel, checker preview, HUD chrome) paints
     its own explicit colors so it stays legible regardless of the
     host page behind it.
  --------------------------------------------------------------- */
  :root {
    --gutter: clamp(16px, 3vw, 48px);
    --ui-scale: 1;

    --panel-bg: #16121f;
    --panel-bg-2: #1f1830;
    --panel-line: rgba(255,255,255,0.10);
    --panel-text: #f3eefc;
    --panel-text-dim: #b7aecb;

    --font-display: 'Baloo 2', 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', system-ui, sans-serif;
    --font-body: 'Poppins', 'Hiragino Sans', system-ui, sans-serif;
    --font-mono: 'Space Mono', ui-monospace, 'SF Mono', monospace;
  }

  /* Pop color presets — selected via [data-pop] on :root */
  :root[data-pop="neon"] {
    --grad-a: #ff2e9f; --grad-b: #7b2ff7; --grad-c: #00e5ff; --accent: #ff2e9f;
  }
  :root[data-pop="citrus"] {
    --grad-a: #ff7a00; --grad-b: #ffd23d; --grad-c: #b6ff3d; --accent: #ff7a00;
  }
  :root[data-pop="candy"] {
    --grad-a: #ff6fb5; --grad-b: #c08cff; --grad-c: #7be0ff; --accent: #ff6fb5;
  }
  :root[data-pop="retro"] {
    --grad-a: #ff4e50; --grad-b: #f9d423; --grad-c: #1fddff; --accent: #ff4e50;
  }

  * { box-sizing: border-box; }

  html, body {
    background: transparent !important;
    height: 100%;
    overflow: hidden;
  }

  body {
    margin: 0;
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ---------------------------------------------------------------
     Transparency-preview checkerboard (edit mode only, decorative)
  --------------------------------------------------------------- */
  #checker {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      repeating-conic-gradient(#2a2438 0% 25%, #1c1826 0% 50%);
    background-size: 28px 28px;
  }
  body.clean #checker, body.preview-clean #checker { display: none; }

  /* ---------------------------------------------------------------
     Stage — the actual overlay content OBS will capture
  --------------------------------------------------------------- */
  #stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .hud-el {
    position: absolute;
    pointer-events: none;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.35));
  }

  [hidden] { display: none !important; }

  /* ---- Logo badge (top-left) ---- */
  .logo-badge {
    top: var(--gutter);
    left: var(--gutter);
    display: flex;
    align-items: center;
    gap: 0.4em;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: calc(var(--ui-scale) * clamp(14px, 1.7vw, 27px));
    color: #fff;
    padding: 0.55em 1.05em;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--grad-a), var(--grad-b));
    letter-spacing: 0.02em;
  }
  .logo-icon { font-size: 0.9em; }

  /* ---- Time capsule (top-right): clock + elapsed timer ---- */
  .time-capsule {
    top: var(--gutter);
    right: var(--gutter);
    display: flex;
    flex-direction: column;
    gap: 0.3em;
    align-items: flex-end;
    padding: 0.6em 1.1em;
    border-radius: 20px;
    background: rgba(20, 16, 30, 0.72);
    border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(6px);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: #fff;
    font-size: calc(var(--ui-scale) * clamp(13px, 1.5vw, 22px));
  }
  .clock-row, .timer-row { display: flex; align-items: baseline; gap: 0.5em; }
  .clock-icon { font-size: 0.85em; }
  .timer-row { font-size: 0.82em; color: var(--grad-c, #9df); }
  .timer-label {
    font-family: var(--font-body);
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: 0.72em;
    opacity: 0.85;
  }

  /* ---- Status + progress badge (middle-left) ---- */
  .status-badge {
    top: 50%;
    left: var(--gutter);
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 0.5em;
    padding: 0.65em 1.1em;
    border-radius: 18px;
    background: rgba(20, 16, 30, 0.72);
    border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(6px);
    color: #fff;
    font-size: calc(var(--ui-scale) * clamp(12px, 1.35vw, 20px));
    min-width: 8em;
  }
  .status-badge .status-head { display: flex; align-items: center; gap: 0.55em; }
  .status-dot {
    width: 0.7em;
    height: 0.7em;
    border-radius: 50%;
    background: var(--status-color, var(--accent));
    box-shadow: 0 0 0 0 var(--status-color, var(--accent));
    animation: pulse 1.6s ease-out infinite;
    flex: none;
  }
  #statusText {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--status-color, var(--accent)) 55%, transparent); }
    70%  { box-shadow: 0 0 0 0.6em transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .progress-wrap { display: flex; flex-direction: column; gap: 0.3em; }
  .progress-label {
    font-size: 0.68em;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--panel-text-dim);
    text-transform: uppercase;
  }
  .progress-track {
    position: relative;
    height: 0.55em;
    border-radius: 999px;
    background: rgba(255,255,255,0.14);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--grad-a), var(--grad-b), var(--grad-c));
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
    transition: width 0.4s ease;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .progress-num {
    align-self: flex-end;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.8em;
    color: var(--panel-text-dim);
  }

  /* ---- Telop / title bar (bottom, full width) ---- */
  .telop-bar {
    left: var(--gutter);
    right: var(--gutter);
    bottom: var(--gutter);
    display: flex;
    align-items: stretch;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(15, 12, 22, 0.78);
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(6px);
  }
  .telop-accent {
    width: 0.5em;
    flex: none;
    background: linear-gradient(180deg, var(--grad-a), var(--grad-b), var(--grad-c));
    background-size: 100% 200%;
    animation: shimmer-v 4s linear infinite;
  }
  @keyframes shimmer-v { to { background-position: 0 -200%; } }
  .telop-text {
    padding: 0.55em 1em;
    min-width: 0;
  }
  .telop-bar .title {
    font-family: var(--font-display);
    font-weight: 800;
    color: #fff;
    font-size: calc(var(--ui-scale) * clamp(20px, 3vw, 42px));
    line-height: 1.15;
    text-wrap: balance;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .telop-bar .subtitle {
    font-family: var(--font-body);
    font-weight: 500;
    color: var(--panel-text-dim);
    font-size: calc(var(--ui-scale) * clamp(12px, 1.3vw, 19px));
    margin-top: 0.15em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------------------------------------------------------------
     Settings toggle + panel (edit mode only — never shown to OBS
     when the page is loaded with ?clean=1)
  --------------------------------------------------------------- */
  #settingsToggle {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 20;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--panel-line);
    background: var(--panel-bg-2);
    color: var(--panel-text);
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }
  #settingsToggle:hover { background: #2a2140; }
  #settingsToggle:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--grad-c, #7be0ff);
    outline-offset: 2px;
  }
  body.clean #settingsToggle, body.preview-clean #settingsToggle { display: none; }

  #settingsPanel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    width: min(360px, 92vw);
    background: var(--panel-bg);
    color: var(--panel-text);
    border-left: 1px solid var(--panel-line);
    padding: 20px 18px 90px;
    overflow-y: auto;
    transform: translateX(105%);
    transition: transform 0.28s ease;
    font-family: var(--font-body);
    font-size: 14px;
  }
  #settingsPanel.open { transform: translateX(0); }
  body.clean #settingsPanel, body.preview-clean #settingsPanel { display: none; }

  #settingsPanel h1 {
    font-family: var(--font-display);
    font-size: 20px;
    margin: 0 0 4px;
  }
  #settingsPanel .hint {
    color: var(--panel-text-dim);
    font-size: 12.5px;
    line-height: 1.6;
    margin: 0 0 18px;
  }
  .field-group {
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--panel-line);
  }
  .field-group:last-of-type { border-bottom: none; }
  .field-group legend {
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--panel-text-dim);
    padding: 0 0 8px;
  }
  label.field {
    display: block;
    margin-bottom: 10px;
  }
  label.field span {
    display: block;
    font-size: 12px;
    color: var(--panel-text-dim);
    margin-bottom: 4px;
  }
  #settingsPanel input[type="text"],
  #settingsPanel input[type="number"],
  #settingsPanel select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--panel-line);
    background: var(--panel-bg-2);
    color: var(--panel-text);
    font-family: var(--font-body);
    font-size: 13.5px;
  }
  #settingsPanel input[type="range"] { width: 100%; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chk-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .chk-row input { accent-color: var(--accent, #ff2e9f); width: 16px; height: 16px; }
  .swatches { display: flex; gap: 8px; margin-top: 4px; }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer;
    padding: 0;
  }
  .swatch[data-selected="true"] { border-color: #fff; }
  .swatch.neon { background: linear-gradient(120deg,#ff2e9f,#7b2ff7); }
  .swatch.citrus { background: linear-gradient(120deg,#ff7a00,#ffd23d); }
  .swatch.candy { background: linear-gradient(120deg,#ff6fb5,#c08cff); }
  .swatch.retro { background: linear-gradient(120deg,#ff4e50,#f9d423); }

  .btn {
    display: block;
    width: 100%;
    padding: 10px 12px;
    border-radius: 9px;
    border: none;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .btn-primary { background: linear-gradient(120deg, var(--grad-a), var(--grad-b)); color: #fff; }
  .btn-secondary { background: var(--panel-bg-2); color: var(--panel-text); border: 1px solid var(--panel-line); }

  #urlOutput {
    width: 100%;
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--panel-line);
    background: var(--panel-bg-2);
    color: var(--panel-text-dim);
    font-family: var(--font-mono);
    font-size: 11.5px;
  }
  #copyStatus {
    font-size: 12px;
    color: var(--grad-c, #7be0ff);
    height: 16px;
    margin-top: 4px;
  }

  #previewBadge {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    background: #16121f;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-family: var(--font-body);
    cursor: pointer;
  }

  /* Phone-width safety: shrink gutter and stack the panel to full width */
  @media (max-width: 480px) {
    #settingsPanel { width: 100vw; }
  }
</style>

<div id="checker" aria-hidden="true"></div>

<main id="stage">
  <div class="hud-el logo-badge" id="logoBadge">
    <span class="logo-icon">✦</span><span id="logoText">STPETE</span>
  </div>

  <div class="hud-el time-capsule" id="timeCapsule">
    <div class="clock-row" id="clockRow">
      <span class="clock-icon">🕒</span>
      <span id="clockText">--:--:--</span>
    </div>
    <div class="timer-row" id="timerRow">
      <span class="timer-label">ON AIR</span>
      <span id="timerText">00:00:00</span>
    </div>
  </div>

  <div class="hud-el status-badge" id="statusBadge">
    <div class="status-head">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">LIVE</span>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <span class="progress-label" id="progressLabelText">PROGRESS</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-num" id="progressNum">0%</span>
    </div>
  </div>

  <div class="hud-el telop-bar" id="telopBar">
    <div class="telop-accent"></div>
    <div class="telop-text">
      <div class="title" id="titleText">STREAM TITLE</div>
      <div class="subtitle" id="subtitleText" hidden></div>
    </div>
  </div>
</main>

<button type="button" id="previewBadge" hidden>👁 編集モードに戻る (Esc)</button>

<button type="button" id="settingsToggle" title="設定を開く (S)" aria-label="設定を開く">⚙</button>

<aside id="settingsPanel" aria-label="HUD設定パネル">
  <h1>Pop Stream HUD</h1>
  <p class="hint">
    このパネルはOBSには映りません。下の「OBS用URLをコピー」で書き出したURLをブラウザソースに設定してください。背景は自動で透過されます。
  </p>

  <fieldset class="field-group">
    <legend>テロップ / タイトル</legend>
    <label class="field"><span>タイトル</span>
      <input type="text" id="titleInput" maxlength="60">
    </label>
    <label class="field"><span>サブタイトル（任意）</span>
      <input type="text" id="subtitleInput" maxlength="80">
    </label>
    <div class="chk-row">
      <input type="checkbox" id="showTelopChk"><label for="showTelopChk">テロップ枠を表示</label>
    </div>
  </fieldset>

  <fieldset class="field-group">
    <legend>ロゴ / ウォーターマーク</legend>
    <label class="field"><span>ロゴテキスト</span>
      <input type="text" id="logoInput" maxlength="20">
    </label>
    <div class="chk-row">
      <input type="checkbox" id="showLogoChk"><label for="showLogoChk">ロゴを表示</label>
    </div>
  </fieldset>

  <fieldset class="field-group">
    <legend>時計 / 経過タイマー</legend>
    <div class="chk-row">
      <input type="checkbox" id="showClockChk"><label for="showClockChk">現在時刻を表示</label>
    </div>
    <div class="chk-row">
      <input type="checkbox" id="showTimerChk"><label for="showTimerChk">経過タイマーを表示</label>
    </div>
    <button type="button" class="btn btn-secondary" id="resetTimerBtn">タイマーをリセット</button>
  </fieldset>

  <fieldset class="field-group">
    <legend>ステータス / 進捗</legend>
    <div class="row-2">
      <label class="field"><span>ステータス文言</span>
        <input type="text" id="statusInput" maxlength="16">
      </label>
      <label class="field"><span>カラー</span>
        <select id="statusPresetSelect">
          <option value="live">LIVE（赤）</option>
          <option value="game">GAME（紫）</option>
          <option value="coding">CODING（緑）</option>
          <option value="break">BREAK（黄）</option>
          <option value="custom">テーマ色に合わせる</option>
        </select>
      </label>
    </div>
    <div class="chk-row">
      <input type="checkbox" id="showStatusChk"><label for="showStatusChk">ステータスを表示</label>
    </div>
    <label class="field"><span>進捗ラベル</span>
      <input type="text" id="progressLabelInput" maxlength="16">
    </label>
    <label class="field"><span>進捗（%、空欄で非表示）</span>
      <input type="number" id="progressInput" min="0" max="100" step="1" placeholder="例: 40">
    </label>
    <div class="chk-row">
      <input type="checkbox" id="showProgressChk"><label for="showProgressChk">進捗バーを表示</label>
    </div>
  </fieldset>

  <fieldset class="field-group">
    <legend>デザイン</legend>
    <div class="swatches" id="popSwatches">
      <button type="button" class="swatch neon" data-pop="neon" title="Neon Pop"></button>
      <button type="button" class="swatch citrus" data-pop="citrus" title="Citrus Pop"></button>
      <button type="button" class="swatch candy" data-pop="candy" title="Candy Pop"></button>
      <button type="button" class="swatch retro" data-pop="retro" title="Retro Pop"></button>
    </div>
    <label class="field" style="margin-top:12px;"><span>全体スケール</span>
      <input type="range" id="uiScaleRange" min="0.6" max="1.6" step="0.05">
    </label>
  </fieldset>

  <fieldset class="field-group">
    <legend>OBSへの反映</legend>
    <button type="button" class="btn btn-secondary" id="previewToggleBtn">この見た目をプレビュー（OBS表示を確認）</button>
    <button type="button" class="btn btn-primary" id="copyUrlBtn">OBS用URLをコピー</button>
    <input type="text" id="urlOutput" readonly aria-label="OBSブラウザソース用URL">
    <div id="copyStatus"></div>
    <p class="hint" style="margin-top:10px;">
      OBS側の推奨設定：幅1920×高さ1080（お好みで調整可）／「シーンが表示されていないときにソースをシャットダウン」はOFF（タイマーが止まらないように）。
    </p>
  </fieldset>
</aside>

<script>
(function () {
  "use strict";

  // Default HUD state. Values are always strings (URLSearchParams-friendly).
  var DEFAULTS = {
    title: "STREAM TITLE",
    subtitle: "",
    logo: "STPETE",
    status: "LIVE",
    statusPreset: "live",
    progress: "",
    progressLabel: "PROGRESS",
    pop: "neon",
    uiScale: "1",
    showClock: "1",
    showTimer: "1",
    showLogo: "1",
    showStatus: "1",
    showProgress: "1",
    showTelop: "1",
    clean: "0"
  };

  var STORAGE_KEY = "pop_hud_settings_v1";
  var TIMER_KEY = "pop_hud_timer_start_v1";

  var state = loadState();
  var previewClean = false;

  function $(sel) { return document.querySelector(sel); }

  function loadState() {
    var saved = {};
    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch (e) { saved = {}; }
    var merged = Object.assign({}, DEFAULTS, saved);
    var params = new URLSearchParams(window.location.search);
    Object.keys(DEFAULTS).forEach(function (key) {
      if (params.has(key)) merged[key] = params.get(key);
    });
    return merged;
  }

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* private mode etc. */ }
  }

  function syncURL() {
    var params = new URLSearchParams();
    Object.keys(DEFAULTS).forEach(function (key) { params.set(key, state[key]); });
    var newUrl = window.location.pathname + "?" + params.toString();
    try { history.replaceState(null, "", newUrl); } catch (e) { /* ignore */ }
  }

  function getTimerStart() {
    var ts = null;
    try { ts = localStorage.getItem(TIMER_KEY); } catch (e) { ts = null; }
    if (!ts) {
      ts = String(Date.now());
      try { localStorage.setItem(TIMER_KEY, ts); } catch (e) { /* ignore */ }
    }
    return Number(ts);
  }

  function resetTimer() {
    try { localStorage.setItem(TIMER_KEY, String(Date.now())); } catch (e) { /* ignore */ }
    tick();
  }

  function formatDuration(ms) {
    var totalSec = Math.floor(ms / 1000);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    function pad(n) { return String(n).padStart(2, "0"); }
    return pad(h) + ":" + pad(m) + ":" + pad(s);
  }

  function tick() {
    var now = new Date();
    var clockEl = $("#clockText");
    if (clockEl) clockEl.textContent = now.toLocaleTimeString("ja-JP", { hour12: false });
    var elapsed = Date.now() - getTimerStart();
    var timerEl = $("#timerText");
    if (timerEl) timerEl.textContent = formatDuration(elapsed);
  }

  function applyStatusPreset(preset) {
    var badge = $("#statusBadge");
    badge.classList.remove("preset-live", "preset-game", "preset-coding", "preset-break", "preset-custom");
    var colors = { live: "#ff3b5c", game: "#8b5cf6", coding: "#00d2a8", break: "#ffb400", custom: "var(--accent)" };
    badge.classList.add("preset-" + preset);
    badge.style.setProperty("--status-color", colors[preset] || colors.live);
  }

  function render() {
    document.documentElement.setAttribute("data-pop", state.pop);
    document.documentElement.style.setProperty("--ui-scale", state.uiScale);
    document.body.classList.toggle("clean", state.clean === "1");

    $("#logoText").textContent = state.logo || "STPETE";
    $("#logoBadge").hidden = state.showLogo !== "1";

    $("#titleText").textContent = state.title || "STREAM TITLE";
    var subEl = $("#subtitleText");
    subEl.textContent = state.subtitle || "";
    subEl.hidden = !state.subtitle;
    $("#telopBar").hidden = state.showTelop !== "1";

    $("#statusText").textContent = state.status || "LIVE";
    $("#statusBadge").hidden = state.showStatus !== "1";
    applyStatusPreset(state.statusPreset);

    var hasProgress = state.showProgress === "1" && state.progress !== "" && state.progress !== null && !isNaN(Number(state.progress));
    $("#progressWrap").hidden = !hasProgress;
    if (hasProgress) {
      var pct = Math.max(0, Math.min(100, Number(state.progress)));
      $("#progressFill").style.width = pct + "%";
      $("#progressNum").textContent = Math.round(pct) + "%";
      $("#progressLabelText").textContent = state.progressLabel || "PROGRESS";
    }

    $("#clockRow").hidden = state.showClock !== "1";
    $("#timerRow").hidden = state.showTimer !== "1";
    $("#timeCapsule").hidden = state.showClock !== "1" && state.showTimer !== "1";

    syncFormFromState();
  }

  function syncFormFromState() {
    $("#titleInput").value = state.title;
    $("#subtitleInput").value = state.subtitle;
    $("#logoInput").value = state.logo;
    $("#statusInput").value = state.status;
    $("#statusPresetSelect").value = state.statusPreset;
    $("#progressInput").value = state.progress;
    $("#progressLabelInput").value = state.progressLabel;
    $("#uiScaleRange").value = state.uiScale;
    $("#showClockChk").checked = state.showClock === "1";
    $("#showTimerChk").checked = state.showTimer === "1";
    $("#showLogoChk").checked = state.showLogo === "1";
    $("#showStatusChk").checked = state.showStatus === "1";
    $("#showProgressChk").checked = state.showProgress === "1";
    $("#showTelopChk").checked = state.showTelop === "1";
    document.querySelectorAll(".swatch").forEach(function (btn) {
      btn.setAttribute("data-selected", String(btn.getAttribute("data-pop") === state.pop));
    });
  }

  function onFieldChange() {
    state.title = $("#titleInput").value;
    state.subtitle = $("#subtitleInput").value;
    state.logo = $("#logoInput").value;
    state.status = $("#statusInput").value;
    state.statusPreset = $("#statusPresetSelect").value;
    state.progress = $("#progressInput").value;
    state.progressLabel = $("#progressLabelInput").value;
    state.uiScale = $("#uiScaleRange").value;
    state.showClock = $("#showClockChk").checked ? "1" : "0";
    state.showTimer = $("#showTimerChk").checked ? "1" : "0";
    state.showLogo = $("#showLogoChk").checked ? "1" : "0";
    state.showStatus = $("#showStatusChk").checked ? "1" : "0";
    state.showProgress = $("#showProgressChk").checked ? "1" : "0";
    state.showTelop = $("#showTelopChk").checked ? "1" : "0";
    render();
    persist();
    syncURL();
  }

  function buildCleanUrl() {
    var params = new URLSearchParams();
    Object.keys(DEFAULTS).forEach(function (key) {
      params.set(key, key === "clean" ? "1" : state[key]);
    });
    return window.location.origin + window.location.pathname + "?" + params.toString();
  }

  function copyUrl() {
    var url = buildCleanUrl();
    $("#urlOutput").value = url;
    var statusEl = $("#copyStatus");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        statusEl.textContent = "コピーしました！OBSのURL欄に貼り付けてください。";
      }).catch(function () {
        statusEl.textContent = "自動コピーできませんでした。下の欄から手動でコピーしてください。";
        $("#urlOutput").select();
      });
    } else {
      statusEl.textContent = "下の欄から手動でコピーしてください。";
      $("#urlOutput").select();
    }
  }

  function togglePanel(force) {
    var panel = $("#settingsPanel");
    var open = typeof force === "boolean" ? force : !panel.classList.contains("open");
    panel.classList.toggle("open", open);
  }

  function togglePreview(force) {
    previewClean = typeof force === "boolean" ? force : !previewClean;
    document.body.classList.toggle("preview-clean", previewClean);
    $("#previewBadge").hidden = !previewClean;
    if (previewClean) togglePanel(false);
  }

  function wireEvents() {
    $("#settingsPanel").addEventListener("input", onFieldChange);
    $("#settingsPanel").addEventListener("change", onFieldChange);

    document.querySelectorAll(".swatch").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.pop = btn.getAttribute("data-pop");
        render(); persist(); syncURL();
      });
    });

    $("#resetTimerBtn").addEventListener("click", resetTimer);
    $("#copyUrlBtn").addEventListener("click", copyUrl);
    $("#settingsToggle").addEventListener("click", function () { togglePanel(); });
    $("#previewToggleBtn").addEventListener("click", function () { togglePreview(true); });
    $("#previewBadge").addEventListener("click", function () { togglePreview(false); });

    document.addEventListener("keydown", function (e) {
      var tag = (document.activeElement && document.activeElement.tagName) || "";
      var typing = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA";
      if (e.key === "Escape") {
        if (previewClean) togglePreview(false);
        else togglePanel(false);
      } else if (!typing && (e.key === "s" || e.key === "S")) {
        togglePanel();
      }
    });
  }

  function init() {
    wireEvents();
    render();
    tick();
    setInterval(tick, 1000);
    // Open the panel automatically only on first-ever visit (not from an OBS clean URL).
    if (state.clean !== "1") {
      var hasVisited = false;
      try { hasVisited = localStorage.getItem("pop_hud_visited_v1") === "1"; } catch (e) {}
      if (!hasVisited) {
        togglePanel(true);
        try { localStorage.setItem("pop_hud_visited_v1", "1"); } catch (e) {}
      }
    }
  }

  if (window.claude && window.claude.hot) {
    window.claude.hot.ready ? window.claude.hot.ready(init) : init();
  } else {
    init();
  }
})();
</script>
