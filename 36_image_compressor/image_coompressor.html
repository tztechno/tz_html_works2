<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Local Image Compressor & Comparison</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --accent: #38bdf8;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      flex-shrink: 0;
    }

    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--accent);
    }

    .header-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .main-container {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    @media (min-width: 768px) {
      body {
        height: 100vh;
        overflow: hidden;
      }
      .main-container {
        flex-direction: row;
        height: calc(100vh - 57px);
      }
    }

    .preview-area {
      flex: 1;
      min-height: 360px;
      position: relative;
      background: radial-gradient(circle, #1f2937 10%, transparent 11%);
      background-size: 16px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    .split-container {
      position: relative;
      max-width: 95%;
      max-height: 85%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      overflow: hidden;
      display: inline-block;
    }

    .split-container img {
      display: block;
      max-width: 100%;
      max-height: 50vh;
      width: auto;
      height: auto;
      pointer-events: none;
    }

    @media (min-width: 768px) {
      .split-container img {
        max-height: 75vh;
      }
    }

    .split-layer-compressed {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      overflow: hidden;
    }

    .split-layer-compressed img {
      position: absolute;
      top: 0;
      left: 0;
      max-width: none;
      max-height: none;
    }

    .slider-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background-color: var(--accent);
      cursor: ew-resize;
      z-index: 10;
      touch-action: none;
    }

    .slider-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--card-bg);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .badge {
      position: absolute;
      bottom: 10px;
      padding: 3px 6px;
      background: rgba(0, 0, 0, 0.75);
      font-size: 10px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 5;
    }

    .badge-left { left: 10px; border-left: 2px solid var(--accent); }
    .badge-right { right: 10px; border-right: 2px solid #9ca3af; }

    .control-panel {
      width: 100%;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    @media (min-width: 768px) {
      .control-panel {
        width: 320px;
        border-top: none;
        border-left: 1px solid var(--border);
        padding: 20px;
        gap: 18px;
        overflow-y: auto;
      }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    select, input[type="range"] {
      width: 100%;
      background: #1f2937;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 4px;
      outline: none;
      font-size: 0.9rem;
    }

    .metric-card {
      background-color: #1f2937;
      border-radius: 6px;
      padding: 12px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
    }

    .metric-val {
      font-weight: 600;
      color: var(--accent);
    }

    .btn {
      background-color: var(--accent);
      color: #0b0f19;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .dropzone-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 25, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      cursor: pointer;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Local Image Compressor & Comparison</h1>
    <span class="header-sub">Browser Canvas Engine</span>
  </header>

  <div class="main-container">
    <div class="preview-area" id="previewArea">
      <div class="dropzone-overlay" id="dropzone">
        <p>Tap to upload or take a photo</p>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" />
      </div>

      <div class="split-container" id="splitContainer" style="display: none;">
        <img id="imgOriginal" alt="Original Image" />
        <div class="split-layer-compressed" id="compressedLayer">
          <img id="imgCompressed" alt="Compressed Image" />
        </div>
        <div class="slider-divider" id="divider">
          <div class="slider-handle">&harr;</div>
        </div>
        <div class="badge badge-left">Compressed</div>
        <div class="badge badge-right">Original</div>
      </div>
    </div>

    <aside class="control-panel">
      <div class="control-group">
        <label for="formatSelect">Output Format</label>
        <select id="formatSelect">
          <option value="image/png">PNG (Quantized)</option>
          <option value="image/webp" selected>WebP</option>
          <option value="image/jpeg">JPEG</option>
        </select>
      </div>

      <div class="control-group" id="qualityControl">
        <label for="qualityRange">Quality: <span id="qualityVal">80</span>%</label>
        <input type="range" id="qualityRange" min="1" max="100" value="80" />
      </div>

      <div class="control-group" id="pngColorsControl" style="display: none;">
        <label for="colorRange">Color Palette: <span id="colorVal">64</span> colors</label>
        <input type="range" id="colorRange" min="4" max="256" step="4" value="64" />
      </div>

      <div class="metric-card">
        <div class="metric-row">
          <span>Dimensions:</span>
          <span class="metric-val" id="dimVal">-</span>
        </div>
        <div class="metric-row">
          <span>Original:</span>
          <span class="metric-val" id="origSizeVal">-</span>
        </div>
        <div class="metric-row">
          <span>Compressed:</span>
          <span class="metric-val" id="compSizeVal">-</span>
        </div>
        <div class="metric-row">
          <span>Reduction:</span>
          <span class="metric-val" id="ratioVal">-</span>
        </div>
      </div>

      <button class="btn" id="downloadBtn">Download Image</button>
    </aside>
  </div>

  <script>
    // Element nodes
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const splitContainer = document.getElementById("splitContainer");
    const compressedLayer = document.getElementById("compressedLayer");
    const divider = document.getElementById("divider");
    const imgOriginal = document.getElementById("imgOriginal");
    const imgCompressed = document.getElementById("imgCompressed");

    const formatSelect = document.getElementById("formatSelect");
    const qualityControl = document.getElementById("qualityControl");
    const pngColorsControl = document.getElementById("pngColorsControl");
    const qualityRange = document.getElementById("qualityRange");
    const qualityVal = document.getElementById("qualityVal");
    const colorRange = document.getElementById("colorRange");
    const colorVal = document.getElementById("colorVal");

    const dimVal = document.getElementById("dimVal");
    const origSizeVal = document.getElementById("origSizeVal");
    const compSizeVal = document.getElementById("compSizeVal");
    const ratioVal = document.getElementById("ratioVal");
    const downloadBtn = document.getElementById("downloadBtn");

    let originalBlob = null;
    let compressedBlob = null;
    let loadedImage = null;

    // Byte size formatting
    function formatBytes(bytes) {
      if (!bytes) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(2) + " " + sizes[i];
    }

    // Input handlers
    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => e.preventDefault());
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    // File loading
    function handleFile(file) {
      if (!file.type.startsWith("image/")) return;
      originalBlob = file;
      origSizeVal.textContent = formatBytes(file.size);

      const reader = new FileReader();
      reader.onload = (e) => {
        loadedImage = new Image();
        loadedImage.onload = () => {
          imgOriginal.src = e.target.result;
          dimVal.textContent = `${loadedImage.width} x ${loadedImage.height}`;
          dropzone.style.display = "none";
          splitContainer.style.display = "inline-block";
          processCompression();
        };
        loadedImage.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Canvas-based compression execution
    function processCompression() {
      if (!loadedImage) return;

      const canvas = document.createElement("canvas");
      canvas.width = loadedImage.width;
      canvas.height = loadedImage.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(loadedImage, 0, 0);

      const format = formatSelect.value;
      const quality = parseFloat(qualityRange.value) / 100;

      // Color quantization emulation for PNG
      if (format === "image/png") {
        const numColors = parseInt(colorRange.value, 10);
        const step = Math.floor(256 / Math.cbrt(numColors));
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
          data[i] = Math.min(255, Math.floor(data[i] / step) * step);
          data[i + 1] = Math.min(255, Math.floor(data[i + 1] / step) * step);
          data[i + 2] = Math.min(255, Math.floor(data[i + 2] / step) * step);
        }
        ctx.putImageData(imageData, 0, 0);
        canvas.toBlob((blob) => updateResults(blob), "image/png");
      } else {
        canvas.toBlob((blob) => updateResults(blob), format, quality);
      }
    }

    // Update rendered preview
    function updateResults(blob) {
      compressedBlob = blob;
      compSizeVal.textContent = formatBytes(blob.size);

      const savings = (((originalBlob.size - blob.size) / originalBlob.size) * 100).toFixed(1);
      ratioVal.textContent = savings >= 0 ? `-${savings}%` : `+${Math.abs(savings)}%`;

      const compressedUrl = URL.createObjectURL(blob);
      imgCompressed.src = compressedUrl;

      imgOriginal.onload = syncPreviewBounds;
      syncPreviewBounds();
    }

    function syncPreviewBounds() {
      imgCompressed.style.width = `${imgOriginal.clientWidth}px`;
      imgCompressed.style.height = `${imgOriginal.clientHeight}px`;
    }

    window.addEventListener("resize", syncPreviewBounds);

    // Touch & mouse split slider logic
    let isDragging = false;

    divider.addEventListener("mousedown", () => { isDragging = true; });
    divider.addEventListener("touchstart", () => { isDragging = true; }, { passive: true });

    window.addEventListener("mouseup", () => { isDragging = false; });
    window.addEventListener("touchend", () => { isDragging = false; });

    function updateSplitPosition(clientX) {
      if (!isDragging) return;
      const rect = splitContainer.getBoundingClientRect();
      let offsetX = clientX - rect.left;
      if (offsetX < 0) offsetX = 0;
      if (offsetX > rect.width) offsetX = rect.width;

      const percentage = (offsetX / rect.width) * 100;
      divider.style.left = `${percentage}%`;
      compressedLayer.style.width = `${percentage}%`;
    }

    window.addEventListener("mousemove", (e) => {
      updateSplitPosition(e.clientX);
    });

    window.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) {
        updateSplitPosition(e.touches[0].clientX);
      }
    }, { passive: true });

    // UI event bindings
    formatSelect.addEventListener("change", () => {
      if (formatSelect.value === "image/png") {
        qualityControl.style.display = "none";
        pngColorsControl.style.display = "flex";
      } else {
        qualityControl.style.display = "flex";
        pngColorsControl.style.display = "none";
      }
      processCompression();
    });

    qualityRange.addEventListener("input", (e) => {
      qualityVal.textContent = e.target.value;
      processCompression();
    });

    colorRange.addEventListener("input", (e) => {
      colorVal.textContent = e.target.value;
      processCompression();
    });

    downloadBtn.addEventListener("click", () => {
      if (!compressedBlob) return;
      const ext = formatSelect.value.split("/")[1];
      const link = document.createElement("a");
      link.href = URL.createObjectURL(compressedBlob);
      link.download = `compressed_output.${ext}`;
      link.click();
    });
  </script>
</body>
</html>
