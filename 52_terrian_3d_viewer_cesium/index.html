<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain 3D Viewer (Cesium)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <aside id="sidebar">
      <h1>Terrain 3D Viewer <small>Cesium</small></h1>

      <label id="drop" class="drop">
        <input id="file" type="file" accept=".tif,.tiff" hidden />
        <span id="dropText">DEM GeoTIFF をドロップ<br />またはクリックして選択</span>
      </label>

      <label>Aerial imagery
        <select id="source"></select>
      </label>
      <label>DEM resolution <output id="maxDimOut"></output>
        <input id="maxDim" type="range" min="100" max="1000" step="50" value="400" />
      </label>
      <label>Vertical exaggeration <output id="vExagOut"></output>
        <input id="vExag" type="range" min="0.5" max="10" step="0.5" value="1.5" />
      </label>
      <label>Detail <output id="detailOut"></output>
        <input id="detail" type="range" min="0.5" max="4" step="0.5" value="1" />
      </label>
      <label class="row"><input id="clip" type="checkbox" checked /> Clip globe to DEM area</label>
      <label class="row"><input id="outline" type="checkbox" /> Show DEM outline</label>

      <div id="status"></div>
      <dl id="stats"></dl>
      <div class="buttons">
        <button id="png" disabled>Save PNG</button>
        <button id="download" disabled>Download standalone HTML</button>
      </div>
      <a class="manual" href="./MANUAL.md">Manual</a>
    </aside>
    <main id="plot"><div class="placeholder">GeoTIFF を読み込むと、ここに 3D 地形が表示されます</div></main>
  </body>
</html>
