<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain 3D Viewer (CesiumJS)</title>

    <!-- CesiumJS from official CDN -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>

    <!-- geotiff.js & proj4 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>

    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        display: flex;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        background-color: #1a1a1a;
        color: #eee;
      }
      #sidebar {
        width: 320px;
        min-width: 320px;
        padding: 20px;
        background-color: #242424;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        border-right: 1px solid #333;
        z-index: 10;
      }
      h1 { font-size: 1.2rem; margin: 0 0 4px 0; }
      .drop {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border: 2px dashed #555;
        border-radius: 8px;
        padding: 24px 12px;
        cursor: pointer;
        background-color: #2e2e2e;
        transition: border-color 0.2s, background-color 0.2s;
      }
      .drop:hover, .drop.dragover {
        border-color: #3b82f6;
        background-color: #1e3a5f;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.85rem;
        color: #ccc;
      }
      label.row {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      select, input[type="range"], button { width: 100%; }
      select {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #333;
        color: #fff;
      }
      button {
        padding: 10px;
        border-radius: 4px;
        border: none;
        background: #3b82f6;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
      }
      button:disabled { background: #444; color: #777; cursor: not-allowed; }
      #status { font-size: 0.8rem; color: #93c5fd; min-height: 1.2em; }
      #stats { font-size: 0.8rem; line-height: 1.5; margin: 0; }
      #cesiumContainer { flex: 1; position: relative; height: 100%; }
      .placeholder {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #888;
        font-size: 1rem;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <aside id="sidebar">
      <h1>Terrain 3D Viewer</h1>

      <label id="drop" class="drop">
        <input id="file" type="file" accept=".tif,.tiff" hidden />
        <span id="dropText">DEM GeoTIFF をドロップ<br />またはクリックして選択</span>
      </label>

      <label>Aerial imagery
        <select id="source"></select>
      </label>
      <label>Mesh resolution <output id="maxDimOut"></output>
        <input id="maxDim" type="range" min="100" max="600" step="50" value="300" />
      </label>
      <label>Vertical exaggeration <output id="vExagOut"></output>
        <input id="vExag" type="range" min="0.5" max="10" step="0.5" value="1.5" />
      </label>
      <label class="row"><input id="axes" type="checkbox" checked /> Show axes</label>

      <div id="status"></div>
      <dl id="stats"></dl>
      <button id="resetView" disabled>Reset Camera View</button>
    </aside>

    <main id="cesiumContainer">
      <div id="placeholder" class="placeholder">GeoTIFF を読み込むと、ここに 3D 地形が表示されます</div>
    </main>

    <script>
      // Initialize Cesium viewer
      const viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        infoBox: false,
        sceneModePicker: false,
        selectionIndicator: false,
        navigationHelpButton: false,
        timeline: false,
        animation: false,
        fullscreenButton: false
      });

      // DOM Elements
      const fileInput = document.getElementById("file");
      const dropArea = document.getElementById("drop");
      const sourceSelect = document.getElementById("source");
      const vExagInput = document.getElementById("vExag");
      const vExagOut = document.getElementById("vExagOut");
      const maxDimInput = document.getElementById("maxDim");
      const maxDimOut = document.getElementById("maxDimOut");
      const axesCheckbox = document.getElementById("axes");
      const statusDiv = document.getElementById("status");
      const statsList = document.getElementById("stats");
      const resetBtn = document.getElementById("resetView");
      const placeholder = document.getElementById("placeholder");

      // App state
      let rawRasters = null;
      let parsedBbox = null;
      let currentImageryLayer = null;

      // Aerial photo tiles
      const IMAGERY_SOURCES = {
        gsi_photo: {
          name: "GSI Aerial Photo (地理院シームレス写真)",
          url: "https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"
        },
        gsi_std: {
          name: "GSI Standard Map (地理院標準地図)",
          url: "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png"
        },
        osm: {
          name: "OpenStreetMap",
          url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
        }
      };

      // Populate imagery dropdown
      Object.entries(IMAGERY_SOURCES).forEach(([key, item]) => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = item.name;
        sourceSelect.appendChild(opt);
      });

      vExagOut.textContent = `${vExagInput.value}x`;
      maxDimOut.textContent = maxDimInput.value;

      // Coordinate axes
      const axesPrimitive = viewer.scene.primitives.add(new Cesium.DebugModelMatrixPrimitive({
        length: 1000.0,
        width: 3.0
      }));
      axesPrimitive.show = axesCheckbox.checked;

      // Change imagery layer
      function updateImagery() {
        if (currentImageryLayer) {
          viewer.imageryLayers.remove(currentImageryLayer);
        }
        const cfg = IMAGERY_SOURCES[sourceSelect.value];
        currentImageryLayer = viewer.imageryLayers.addImageryProvider(
          new Cesium.UrlTemplateImageryProvider({
            url: cfg.url,
            maximumLevel: 18
          })
        );
      }
      updateImagery();
      sourceSelect.addEventListener("change", updateImagery);

      // Exaggeration handler
      vExagInput.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        vExagOut.textContent = `${val}x`;
        viewer.scene.verticalExaggeration = val;
      });

      // Resolution handler
      maxDimInput.addEventListener("input", (e) => {
        maxDimOut.textContent = e.target.value;
        if (rawRasters && parsedBbox) {
          renderTerrain(rawRasters, parsedBbox);
        }
      });

      axesCheckbox.addEventListener("change", (e) => {
        axesPrimitive.show = e.target.checked;
      });

      // Focus camera
      function focusTerrain(bbox) {
        const rect = Cesium.Rectangle.fromDegrees(bbox.minLon, bbox.minLat, bbox.maxLon, bbox.maxLat);
        viewer.camera.flyTo({
          destination: rect,
          duration: 1.2
        });

        const centerCarto = Cesium.Rectangle.center(rect);
        const centerCartesian = Cesium.Cartographic.toCartesian(centerCarto);
        axesPrimitive.modelMatrix = Cesium.Transforms.eastNorthUpToFixedFrame(centerCartesian);
      }

      resetBtn.addEventListener("click", () => {
        if (parsedBbox) focusTerrain(parsedBbox);
      });

      // Coordinate bbox resolution
      function resolveBbox(image) {
        const bbox = image.getBoundingBox();
        const geoKeys = image.getGeoKeys();

        if (geoKeys && geoKeys.ProjectedCSTypeGeoKey) {
          const epsg = geoKeys.ProjectedCSTypeGeoKey;
          try {
            const minPt = proj4(`EPSG:${epsg}`, "EPSG:4326", [bbox[0], bbox[1]]);
            const maxPt = proj4(`EPSG:${epsg}`, "EPSG:4326", [bbox[2], bbox[3]]);
            return {
              minLon: Math.min(minPt[0], maxPt[0]),
              minLat: Math.min(minPt[1], maxPt[1]),
              maxLon: Math.max(minPt[0], maxPt[0]),
              maxLat: Math.max(minPt[1], maxPt[1])
            };
          } catch {
            // fallback
          }
        }

        return {
          minLon: bbox[0],
          minLat: bbox[1],
          maxLon: bbox[2],
          maxLat: bbox[3]
        };
      }

      // Build heightmap terrain
      function renderTerrain(rasters, bbox) {
        statusDiv.textContent = "Updating terrain...";
        const targetDim = parseInt(maxDimInput.value, 10);
        const srcWidth = rasters.width;
        const srcHeight = rasters.height;
        const elevationData = rasters[0];

        const stepX = srcWidth / targetDim;
        const stepY = srcHeight / targetDim;
        const heightBuffer = new Float32Array(targetDim * targetDim);

        let minZ = Infinity;
        let maxZ = -Infinity;

        for (let y = 0; y < targetDim; y++) {
          for (let x = 0; x < targetDim; x++) {
            const srcX = Math.min(Math.floor(x * stepX), srcWidth - 1);
            const srcY = Math.min(Math.floor(y * stepY), srcHeight - 1);
            const val = elevationData[srcY * srcWidth + srcX];

            if (val > -1000 && val < 10000) {
              heightBuffer[y * targetDim + x] = val;
              if (val < minZ) minZ = val;
              if (val > maxZ) maxZ = val;
            } else {
              heightBuffer[y * targetDim + x] = 0;
            }
          }
        }

        const terrainProvider = new Cesium.CustomHeightmapTerrainProvider({
          width: targetDim,
          height: targetDim,
          tilingScheme: new Cesium.GeographicTilingScheme(),
          callback: function () {
            return heightBuffer;
          }
        });

        viewer.terrainProvider = terrainProvider;
        focusTerrain(bbox);

        placeholder.style.display = "none";
        resetBtn.disabled = false;
        statusDiv.textContent = "Terrain loaded successfully.";
        statsList.innerHTML = `
          <dt>Grid size:</dt><dd>${srcWidth} x ${srcHeight}</dd>
          <dt>Resolution:</dt><dd>${targetDim} x ${targetDim}</dd>
          <dt>Min/Max:</dt><dd>${minZ.toFixed(1)}m / ${maxZ.toFixed(1)}m</dd>
        `;
      }

      // Load GeoTIFF file
      async function handleGeoTiffFile(file) {
        try {
          statusDiv.textContent = `Reading ${file.name}...`;
          const arrayBuffer = await file.arrayBuffer();
          const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
          const image = await tiff.getImage();

          parsedBbox = resolveBbox(image);
          rawRasters = await image.readRasters();

          renderTerrain(rawRasters, parsedBbox);
        } catch (err) {
          statusDiv.textContent = `Error: ${err.message}`;
        }
      }

      // Bind events
      dropArea.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) handleGeoTiffFile(e.target.files[0]);
      });

      dropArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropArea.classList.add("dragover");
      });
      dropArea.addEventListener("dragleave", () => dropArea.classList.remove("dragover"));
      dropArea.addEventListener("drop", (e) => {
        e.preventDefault();
        dropArea.classList.remove("dragover");
        if (e.dataTransfer.files.length > 0) {
          handleGeoTiffFile(e.dataTransfer.files[0]);
        }
      });
    </script>
  </body>
</html>
